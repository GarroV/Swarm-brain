<!doctype html>
<meta charset="utf-8" />
<title>scriba · tone</title>
<style>
  body {
    font:
      16px/1.5 system-ui,
      sans-serif;
    margin: 2rem;
    background: #101418;
    color: #e8eef4;
  }
  b {
    color: #7ee787;
  }
</style>
<p>scriba · проверочный тон <b id="state">запускается…</b></p>
<script>
  // Страница для смоука записи: постоянный тон 440 Гц в звуковой выход браузера.
  // Автовоспроизведение разрешено флагом --autoplay-policy=no-user-gesture-required:
  // жать «играть» в звонке некому.
  const context = new AudioContext();
  const oscillator = context.createOscillator();
  const gain = context.createGain();
  oscillator.type = "sine";
  oscillator.frequency.value = 440;
  gain.gain.value = 0.25;
  oscillator.connect(gain).connect(context.destination);
  oscillator.start();
  context.resume().then(
    () => (document.getElementById("state").textContent = "звучит, состояние " + context.state),
    (error) => (document.getElementById("state").textContent = "НЕ звучит: " + error),
  );
</script>
