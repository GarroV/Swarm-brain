<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Meet - lobby</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        background: #202124;
        color: #ffffff;
      }
      main {
        padding: 24px;
      }
      input {
        width: 240px;
        height: 24px;
        font-size: 14px;
        padding: 8px;
      }
      button {
        font-size: 14px;
        padding: 8px 16px;
      }
      .controls {
        display: flex;
        gap: 8px;
        margin: 16px 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Ready to join?</h1>
      <div class="name-field">
        <input jsname="YPqjbf" type="text" aria-label="Your name" value="scriba" />
      </div>
      <div class="controls">
        <button aria-label="Turn off microphone"><span>Mic</span></button>
        <button aria-label="Turn off camera"><span>Camera</span></button>
      </div>
      <button aria-label="Ask to join"><span>Ask to join</span></button>
    </main>
  </body>
</html>
