name: Демо-данные (руками)

# Сбрасывает ДЕМО-воркспейс прода к эталону сейчас, не дожидаясь ближайшего тика pg_cron
# `demo-reset` (он идёт сам каждые 30 минут). Сброс — функция `public.demo_reset()`, вызов лежит
# в `scripts/seed-demo.sql`. Нужен, например, сразу после раскатки новой версии эталона.
#
# Зачем через CI: скрипт умеет ходить в удалённую базу (`ALLOW_REMOTE=1`), но пароль прод-базы
# живёт только в секретах репозитория — локально его нет, как и у наката миграций (issue #398).
#
# Замки — те же, что в самом скрипте, и ещё один сверху:
#   · воркспейс только `demo`: слаг зашит константой в функции, передать другой некуда;
#   · сброс идемпотентный: сносит только демо и засевает эталон заново, в одной транзакции;
#   · кнопка требует ввести слово `demo` — чтобы случайный клик ничего не запустил.
#
# Это раскатка: нужно «да» владельца, как на любую правку прод-данных.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Введите demo, чтобы подтвердить сброс демо к эталону"
        type: string
        required: true

concurrency:
  group: deploy-window          # общая с раскаткой: две операции над продом разом не нужны
  cancel-in-progress: false

jobs:
  seed:
    name: Сбросить демо к эталону
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Проверить подтверждение
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "demo" ]; then
            echo "отказ: подтверждение не совпало (ожидалось demo)" >&2
            exit 1
          fi
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v1
        with:
          version: 2.118.0
      - name: Сбросить
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Через Management API, а не psql: у базы проекта только IPv6, а раннер GitHub ходит
          # по IPv4 — прямое подключение отвечает «Network is unreachable». Пулер потребовал бы
          # пароль базы, которого в секретах нет (проверено прогоном 23.09.2026).
          #
          # Management API не понимает psql-команд — поэтому в `scripts/seed-demo.sql` их нет:
          # там один вызов функции, и слаг воркспейса живёт в ней, а не в подстановке здесь.
          supabase link --project-ref vbqglndbxkpmreccpqmr
          grep -q "public.demo_reset()" scripts/seed-demo.sql || { echo "в сиде нет вызова demo_reset()" >&2; exit 1; }
          supabase db query --linked -f scripts/seed-demo.sql
