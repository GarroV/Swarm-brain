name: Демо-данные (руками)

# Сбрасывает ДЕМО-воркспейс прода к эталону сейчас, не дожидаясь ближайшего тика pg_cron
# `demo-reset` (он идёт сам каждые 30 минут). Сброс — функция `public.demo_reset()`, вызов лежит
# в `scripts/seed-demo.sql` (локальный контур) и в шлюзе. Нужен, например, сразу после раскатки новой версии эталона.
#
# Зачем через CI: пароля прод-базы в секретах нет. С 13.10.2026 (#919) кнопка ходит на свой сервер
# ключом шлюза раскатки (SWARM_DEPLOY_SSH_KEY) в его команду `demo-reset` (deploy/server/gate.sh):
# на сервере зашит ровно `select public.demo_reset();`, из CI не уходит ни SQL, ни аргументы.
#
# Замки — те же, что в самом скрипте, и ещё один сверху:
#   · воркспейс только `demo`: слаг зашит константой в функции, передать другой некуда;
#   · сброс идемпотентный: сносит только демо и засевает эталон заново, в одной транзакции;
#   · кнопка требует ввести слово `demo` — чтобы случайный клик ничего не запустил.
#
# Это раскатка: нужно «да» владельца, как на любую правку прод-данных.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Введите demo, чтобы подтвердить сброс демо к эталону"
        type: string
        required: true

concurrency:
  group: deploy-window          # общая с раскаткой: две операции над продом разом не нужны
  cancel-in-progress: false

jobs:
  seed:
    name: Сбросить демо к эталону
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Проверить подтверждение
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "demo" ]; then
            echo "отказ: подтверждение не совпало (ожидалось demo)" >&2
            exit 1
          fi
      - name: Ключ раскатки на свой сервер
        uses: ./.github/actions/swarm-deploy-ssh
        with:
          ssh-key: ${{ secrets.SWARM_DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.SWARM_DEPLOY_KNOWN_HOSTS }}
      - name: Сбросить
        run: |
          . scripts/lib/swarm-server.sh
          swarm_server demo-reset
