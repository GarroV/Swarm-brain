name: Демо-данные (руками)

# Заливает витринные данные доски инициатив в ДЕМО-воркспейс прода (`scripts/seed-demo.sql`).
#
# Зачем через CI: скрипт умеет ходить в удалённую базу (`ALLOW_REMOTE=1`), но пароль прод-базы
# живёт только в секретах репозитория — локально его нет, как и у наката миграций (issue #398).
#
# Замки — те же, что в самом скрипте, и ещё один сверху:
#   · воркспейс только `demo`/`demo-*` (рабочие слаги скрипт отбивает сам);
#   · сид идемпотентный: фиксированные UUID и `on conflict do update`, ни одного `delete`;
#   · кнопка требует ввести слово `demo` — чтобы случайный клик ничего не запустил.
#
# Это раскатка: нужно «да» владельца, как на любую правку прод-данных.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Введите demo, чтобы подтвердить заливку витринных данных"
        type: string
        required: true

concurrency:
  group: deploy-window          # общая с раскаткой: две операции над продом разом не нужны
  cancel-in-progress: false

jobs:
  seed:
    name: Залить демо-данные
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Проверить подтверждение
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "demo" ]; then
            echo "отказ: подтверждение не совпало (ожидалось demo)" >&2
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Залить
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # Пароль в URL кодируем: он может содержать символы, ломающие строку подключения.
          PW=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"],safe=""))')
          # Прямое подключение к базе проекта (регион eu-central-1, `supabase projects list`).
          # Пулер здесь не нужен: прогон разовый и короткий.
          export DB_URL="postgresql://postgres:${PW}@db.vbqglndbxkpmreccpqmr.supabase.co:5432/postgres"
          ALLOW_REMOTE=1 GROUP_ID=demo ./scripts/seed-demo.sh
