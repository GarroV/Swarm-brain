name: Накат миграций БД (руками)

# Накатывает миграции из supabase/migrations на прод по кнопке — на свой сервер через шлюз по ssh
# (scripts/migrate-server.sh, docs/DEPLOY.md). До 13.10.2026 это был `supabase db push` в облако;
# с переезда на свой сервер (#915, #919) облачного проекта нет.
#
# Что делает скрипт: сверяет файлы supabase/migrations/<версия>_<имя>.sql с журналом применённых
# на сервере и катит неприменённые по порядку версий, каждую одной транзакцией вместе с учётной
# записью; останавливается на первой ошибке. Миграция старше последней применённой тоже накатится
# (прежний флаг include_all больше не нужен — сверка идёт по версиям, а не по «хвосту» истории).
#
# Порядок остаётся прежним: сначала миграция, потом функции. Деплой функций раньше базы = код
# обращается к колонкам и таблицам, которых ещё нет.
#
# Разрешение владельца обязательно, как и на любую раскатку. Окно здесь не форсится автоматикой:
# кнопку жмут осознанно.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Сухой прогон: показать, что уедет на прод, ничего не менять"
        type: boolean
        default: true

concurrency:
  group: deploy-window          # общая с раскаткой функций: две раскатки разом не нужны никогда
  cancel-in-progress: false

jobs:
  migrate:
    name: Накатить миграции
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Ключ раскатки на свой сервер
        uses: ./.github/actions/swarm-deploy-ssh
        with:
          ssh-key: ${{ secrets.SWARM_DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.SWARM_DEPLOY_KNOWN_HOSTS }}
      - name: План или накат
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            ./scripts/migrate-server.sh --dry-run
          else
            ./scripts/migrate-server.sh
          fi
