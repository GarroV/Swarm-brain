name: Децимус — секреты API (руками)

# Переносит сервисный токен API Децимуса (секрет репозитория DECIMUS_API_TOKEN) и адрес
# в секреты Edge Functions и проверяет, что Децимус его принимает. Токен выпускается на
# площадке Децимуса (`tools/api_token.py issue swarm …`, decimus docs/08-deploy.md §8.17)
# и кладётся в секрет репозитория конвейером `| gh secret set`, не показываясь на экране:
# входной параметр запуска для этого не годится — в публичном репозитории он виден.
# Решения: docs/decisions/2026-10-11-decimus-link-blocks.md, decimus D387/D388.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Адрес Децимуса (DECIMUS_API_URL)"
        type: string
        default: "https://decimus.vasiliy-garro.workers.dev"

concurrency:
  group: deploy-window
  cancel-in-progress: false

jobs:
  secrets:
    name: Проверить токен и записать в секреты
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Проверить ввод
        env:
          BASE_URL: ${{ inputs.base_url }}
          TOKEN: ${{ secrets.DECIMUS_API_TOKEN }}
        run: |
          [[ "$BASE_URL" =~ ^https://[A-Za-z0-9.-]+$ ]] || { echo "отказ: base_url не https-адрес без пути" >&2; exit 1; }
          [[ ${#TOKEN} -ge 32 ]] || { echo "отказ: секрет DECIMUS_API_TOKEN пуст или короче 32 знаков" >&2; exit 1; }

      # Сперва смоук, потом запись: неверный токен не должен заменить рабочий.
      - name: Смоук API Децимуса
        env:
          BASE_URL: ${{ inputs.base_url }}
          TOKEN: ${{ secrets.DECIMUS_API_TOKEN }}
        run: |
          set -euo pipefail
          url="$BASE_URL/api/v1/ratings/scores?type=rs"
          без=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url")
          [[ "$без" == 401 ]] || { echo "без токена ждём 401, пришло $без" >&2; exit 1; }
          с=$(curl -s -o "$RUNNER_TEMP/scores.json" -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer $TOKEN" "$url")
          [[ "$с" == 200 ]] || { echo "с токеном ждём 200, пришло $с: $(head -c 300 "$RUNNER_TEMP/scores.json")" >&2; exit 1; }
          jq -e '(.periods | type == "array") and (.units | type == "array")' "$RUNNER_TEMP/scores.json" >/dev/null \
            || { echo "ответ без periods/units" >&2; exit 1; }
          echo "РС: периодов $(jq '.periods | length' "$RUNNER_TEMP/scores.json"), пиццерий $(jq '.units | length' "$RUNNER_TEMP/scores.json")" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.118.0

      - name: Записать в секреты Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BASE_URL: ${{ inputs.base_url }}
          TOKEN: ${{ secrets.DECIMUS_API_TOKEN }}
        run: |
          set -euo pipefail
          supabase secrets set --project-ref vbqglndbxkpmreccpqmr \
            "DECIMUS_API_URL=$BASE_URL" "DECIMUS_API_TOKEN=$TOKEN" >/dev/null
          supabase secrets list --project-ref vbqglndbxkpmreccpqmr | grep -E 'DECIMUS_API_(URL|TOKEN)' | awk '{print $1}'
