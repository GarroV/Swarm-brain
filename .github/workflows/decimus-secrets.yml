name: Децимус — секреты API (руками)

# Переносит сервисный токен API Децимуса (секрет репозитория DECIMUS_API_TOKEN) и адрес
# в секреты Edge Functions и проверяет, что Децимус его принимает. Токен выпускается на
# площадке Децимуса (`tools/api_token.py issue swarm …`, decimus docs/08-deploy.md §8.17)
# и кладётся в секрет репозитория конвейером `| gh secret set`, не показываясь на экране:
# входной параметр запуска для этого не годится — в публичном репозитории он виден.
# Решения: docs/decisions/2026-10-11-decimus-link-blocks.md, decimus D387/D388.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Адрес Децимуса (DECIMUS_API_URL)"
        type: string
        default: "https://decimus.vasiliy-garro.workers.dev"

concurrency:
  group: deploy-window
  cancel-in-progress: false

jobs:
  secrets:
    name: Проверить токен и записать в секреты
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Проверить ввод
        env:
          BASE_URL: ${{ inputs.base_url }}
          TOKEN: ${{ secrets.DECIMUS_API_TOKEN }}
        run: |
          [[ "$BASE_URL" =~ ^https://[A-Za-z0-9.-]+$ ]] || { echo "отказ: base_url не https-адрес без пути" >&2; exit 1; }
          [[ ${#TOKEN} -ge 32 ]] || { echo "отказ: секрет DECIMUS_API_TOKEN пуст или короче 32 знаков" >&2; exit 1; }

      # Сперва смоук, потом запись: неверный токен не должен заменить рабочий.
      - name: Смоук API Децимуса
        env:
          BASE_URL: ${{ inputs.base_url }}
          TOKEN: ${{ secrets.DECIMUS_API_TOKEN }}
        run: |
          set -euo pipefail
          url="$BASE_URL/api/v1/ratings/scores?type=rs"
          code_anon=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url")
          [[ "$code_anon" == 401 ]] || { echo "без токена ждём 401, пришло $code_anon" >&2; exit 1; }
          code_auth=$(curl -s -o "$RUNNER_TEMP/scores.json" -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer $TOKEN" "$url")
          [[ "$code_auth" == 200 ]] || { echo "с токеном ждём 200, пришло $code_auth: $(head -c 300 "$RUNNER_TEMP/scores.json")" >&2; exit 1; }
          jq -e '(.periods | type == "array") and (.units | type == "array")' "$RUNNER_TEMP/scores.json" >/dev/null \
            || { echo "ответ без periods/units" >&2; exit 1; }
          echo "РС: периодов $(jq '.periods | length' "$RUNNER_TEMP/scores.json"), пиццерий $(jq '.units | length' "$RUNNER_TEMP/scores.json")" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          code_maps=$(curl -s -o "$RUNNER_TEMP/maps.json" -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer $TOKEN" "$BASE_URL/api/v1/maps/ratings")
          [[ "$code_maps" == 200 ]] || { echo "карты: ждём 200, пришло $code_maps: $(head -c 300 "$RUNNER_TEMP/maps.json")" >&2; exit 1; }
          jq -e '(.countries | type == "array") and (.units | type == "array")' "$RUNNER_TEMP/maps.json" >/dev/null \
            || { echo "карты: ответ без countries/units" >&2; exit 1; }
          echo "Карты: стран $(jq '.countries | length' "$RUNNER_TEMP/maps.json"), пиццерий $(jq '.units | length' "$RUNNER_TEMP/maps.json"), загрузка $(jq -r '.loaded_at' "$RUNNER_TEMP/maps.json")" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v1
        with:
          version: 2.118.0

      - name: Записать в секреты Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BASE_URL: ${{ inputs.base_url }}
          TOKEN: ${{ secrets.DECIMUS_API_TOKEN }}
        run: |
          set -euo pipefail
          supabase secrets set --project-ref vbqglndbxkpmreccpqmr \
            "DECIMUS_API_URL=$BASE_URL" "DECIMUS_API_TOKEN=$TOKEN" >/dev/null
          supabase secrets list --project-ref vbqglndbxkpmreccpqmr | grep -E 'DECIMUS_API_(URL|TOKEN)' | awk '{print $1}'

      # Сверка контракта: те же модули разбора, что в swarm-api/swarm-mcp, на живых ответах.
      # В лог — только счётчики (scripts/decimus-contract-smoke.ts).
      - name: Забрать ответы для сверки
        env:
          BASE_URL: ${{ inputs.base_url }}
          TOKEN: ${{ secrets.DECIMUS_API_TOKEN }}
        run: |
          set -euo pipefail
          get() { # путь файл
            code=$(curl -s -o "$RUNNER_TEMP/$2" -w '%{http_code}' --max-time 30 \
              -H "Authorization: Bearer $TOKEN" "$BASE_URL$1")
            [[ "$code" == 200 ]] || { echo "$1: ждём 200, пришло $code" >&2; exit 1; }
          }
          get "/api/v1/ratings/scores?type=rko" scores-rko.json
          from=$(date -u -d '180 days ago' +%F)
          get "/api/v1/inspections?from=$from&limit=50" inspections.json
          first=$(jq -r '.inspections[0].id // empty' "$RUNNER_TEMP/inspections.json")
          if [[ -n "$first" ]]; then
            [[ "$first" =~ ^[0-9a-f-]{36}$ ]] || { echo "кривой id проверки" >&2; exit 1; }
            get "/api/v1/inspections/$first" inspection.json
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      - name: Сверить разбор Swarm с ответами Децимуса
        run: deno run --allow-read scripts/decimus-contract-smoke.ts "$RUNNER_TEMP" | tee -a "$GITHUB_STEP_SUMMARY"
