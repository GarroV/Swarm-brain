name: Ночная раскатка

# Вливает в main PR с меткой `deploy-window` — ночью, когда команда не работает.
# Правило владельца 2026-08-27: апдейты катятся всегда во внерабочее время
# (docs/decisions/2026-08-27-deploy-at-night.md). Мёрж в main = раскатка веба:
# Cloudflare Pages собирает прод с main сам.
#
# Вся логика — в scripts/deploy-window-merge.sh: так её можно прогнать локально в сухом
# режиме (DRY_RUN=1) и не выяснять поведение автоматики уже на проде.

on:
  schedule:
    # КАЖДЫЕ 15 МИНУТ окна 23:00–06:59 по Белграду, круглый год (владелец 16.09.2026: «за ночь хоть
    # миллион прогонов, похер», docs/decisions/2026-09-16-runs-per-night.md).
    #
    # Почему не раз в час (issue #556). Был `0 21-23,0-5 * * *` — девять запусков за ночь на бумаге.
    # На деле GitHub отдавал два-три запуска в сутки с опозданием на часы (23:30, 04:20 и ~09:50 UTC
    # за 22–27.09; запуск в 09:50 уже вне окна — впустую), а 28.09 запуск 23:00 UTC не пришёл вовсе.
    # GitHub не обещает запуск по расписанию: под нагрузкой задерживает и выкидывает, сильнее всего
    # в начале часа. Поэтому минуты не круглые (7/22/37/52) и запусков много: пропуск одного не стоит
    # ночи, ближайший следующий через 15 минут. Опоздавший за край окна запуск безвреден — гейт
    # местного времени в scripts/deploy-window-merge.sh выходит, ничего не вливая.
    #
    # Двойного влития нет: прогоны идут строго по одному (concurrency ниже), каждый берёт ОДИН PR и
    # снимает с него метку, а влитый PR закрыт и в список открытых не попадает.
    #
    # Диапазон UTC шире окна нарочно: Белград летом UTC+2, зимой UTC+1, поэтому 23:00–06:59
    # местного — это 21:00–04:59 UTC летом и 22:00–05:59 UTC зимой. Берём объединение, а лишний
    # час на краю отсекает тот же гейт местного времени. Так расписание не надо трогать дважды в год.
    - cron: "7,22,37,52 21-23,0-5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Сухой прогон: показать решение, ничего не вливать"
        type: boolean
        default: true
      force:
        description: "Обойти проверку окна (живой баг обгоняет окно)"
        type: boolean
        default: false

# Две раскатки одновременно не нужны никогда. Группа общая с кнопками deploy-functions.yml и
# deploy-migrations.yml. Оговорка GitHub: в группе ждёт не больше одного прогона — новый ожидающий
# отменяет прежнего ожидающего (идущий не трогается). Отменённая так кнопка видна как «cancelled» —
# нажать ещё раз.
concurrency:
  group: deploy-window
  cancel-in-progress: false

jobs:
  merge:
    name: Влить помеченный PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # пуш в main
      pull-requests: write   # мёрж, снятие метки, комментарий
    steps:
      # fetch-depth: 0 — нужны метка prod-deployed и история: без них не понять, какие edge-функции
      # изменились с прошлой раскатки (на shallow-клоне diff по метке невозможен).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # CLI нужен для `supabase functions deploy` после мёржа.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Настроить git для метки prod-deployed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Раскатка помеченного PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          FORCE: ${{ inputs.force && '1' || '0' }}
          # Только токен раскатки. Прод-ключ в CI не нужен: проверка «кто в проде» в ночном окне
          # пропускается осознанно (см. deploy-window-merge.sh), а деплою функций хватает этого токена.
          # Этим же токеном гейт миграций спрашивает Management API, применена ли схема (issue #509):
          # без него он честно скажет «проверить нечем» и остановит раскатку, а не пропустит молча.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bash scripts/deploy-window-merge.sh
