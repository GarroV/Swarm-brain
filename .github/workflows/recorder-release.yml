name: recorder-release

# Собирает ПРЕДсобранный SwarmRecorder.app в CI (macOS-раннер, контролируемый SDK) и публикует
# его как asset релиза recorder-build-<VERSION>. Установщик и апдейтер качают этот .app —
# сборки из исходников на машинах пользователей больше нет (issue #19).
#
# Как раскатить новую сборку рекордера:
#   1) поднять recorder/VERSION (+ код), смёржить в main, проверить сборку;
#   2) создать и запушить тег recorder-build-<N> (N = VERSION) — CI соберёт и опубликует asset;
#   3) поднять номер и sha256 (из сводки этого прогона) в supabase/functions/_shared/recorder-release.ts
#      и раскатать swarm-recorder-version + swarm-recorder-setup → все рекордеры обновятся.
#
# Архив в бакете НЕ перезаписывается (#203): опубликованная сборка неизменна, и её сумма, зашитая
# в код, остаётся верной. Пересобрать тот же номер нельзя — поднимай recorder/VERSION.

on:
  push:
    tags:
      - 'recorder-build-*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    # Потолок на зависание. concurrency тут НЕ ставим: прогоны идут по тегу recorder-build-N,
    # каждый публикует свой ассет — отменять предыдущий нельзя, релиз останется без файла.
    timeout-minutes: 30   # SDK macOS 14 → бинарь с minos 13.0 запускается на 13/14/15+
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build prebuilt .app (universal, macOS 13+)
        run: bash ./recorder/build-app-ci.sh

      - name: Read build number from recorder/VERSION
        id: v
        run: echo "build=$(tr -dc '0-9' < recorder/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Publish release asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: recorder-build-${{ steps.v.outputs.build }}
          name: SwarmRecorder build ${{ steps.v.outputs.build }} (prebuilt)
          body: >-
            Предсобранный SwarmRecorder.app (universal arm64+x86_64, minos 13.0) для установки
            без Xcode/Command Line Tools. Установщик скачивает этот .app и локально переподписывает
            per-machine сертификатом (issue #19).
          files: recorder/SwarmRecorder-${{ steps.v.outputs.build }}.zip
          fail_on_unmatched_files: true

      - name: Контрольная сумма архива (в _shared/recorder-release.ts)
        env:
          BUILD: ${{ steps.v.outputs.build }}
        run: |
          set -euo pipefail
          SHA="$(shasum -a 256 "recorder/SwarmRecorder-$BUILD.zip" | cut -d' ' -f1)"
          echo "SwarmRecorder-$BUILD.zip sha256 $SHA"
          printf '### Сборка %s\n\n`RECORDER_ASSET_SHA256 = "%s"`\n' "$BUILD" "$SHA" >> "$GITHUB_STEP_SUMMARY"

      # Раздача идёт из Storage своего сервера (https://api.swarm-team.app/storage/v1/object/public/…),
      # не с GitHub (issue #91: release asset анонимно 404). Заливает шлюз раскатки командой
      # recorder-upload (#919): service-role ключ остаётся на сервере и в CI не попадает.
      # Шлюз не перезаписывает существующий объект (#203): тот же номер с другим содержимым — ошибка.
      - name: Ключ шлюза раскатки
        uses: ./.github/actions/swarm-deploy-ssh
        with:
          ssh-key: ${{ secrets.SWARM_DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.SWARM_DEPLOY_KNOWN_HOSTS }}

      - name: Upload zip to Storage (раздача установщику и апдейтеру)
        env:
          BUILD: ${{ steps.v.outputs.build }}
        run: |
          set -euo pipefail
          . scripts/lib/swarm-server.sh
          swarm_server recorder-upload "$BUILD" < "recorder/SwarmRecorder-$BUILD.zip"
          # Свой User-Agent: Cloudflare перед сервером режет часть дефолтных (403).
          URL="https://api.swarm-team.app/storage/v1/object/public/swarm_drive/recorder/SwarmRecorder-$BUILD.zip"
          CODE="$(curl -sS -A 'swarm-recorder-release-ci' -o pub.zip -w '%{http_code}' "$URL")"
          echo "анонимная раздача SwarmRecorder-$BUILD.zip: HTTP $CODE"
          [ "$CODE" = "200" ]
          # Раздаётся ровно то, что собрано здесь: иначе сумма из сводки не совпадёт у людей.
          [ "$(shasum -a 256 pub.zip | cut -d' ' -f1)" = "$(shasum -a 256 "recorder/SwarmRecorder-$BUILD.zip" | cut -d' ' -f1)" ]
