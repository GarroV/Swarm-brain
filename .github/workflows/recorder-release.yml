name: recorder-release

# Собирает ПРЕДсобранный SwarmRecorder.app в CI (macOS-раннер, контролируемый SDK) и публикует
# его как asset релиза recorder-build-<VERSION>. Установщик и апдейтер качают этот .app —
# сборки из исходников на машинах пользователей больше нет (issue #19).
#
# Как раскатить новую сборку рекордера:
#   1) поднять recorder/VERSION (+ код), смёржить в main, проверить сборку;
#   2) создать и запушить тег recorder-build-<N> (N = VERSION) — CI соберёт и опубликует asset;
#   3) поднять LATEST_BUILD в supabase/functions/swarm-recorder-version → все рекордеры обновятся.

on:
  push:
    tags:
      - 'recorder-build-*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    # Потолок на зависание. concurrency тут НЕ ставим: прогоны идут по тегу recorder-build-N,
    # каждый публикует свой ассет — отменять предыдущий нельзя, релиз останется без файла.
    timeout-minutes: 30   # SDK macOS 14 → бинарь с minos 13.0 запускается на 13/14/15+
    steps:
      - uses: actions/checkout@v4

      - name: Build prebuilt .app (universal, macOS 13+)
        run: bash ./recorder/build-app-ci.sh

      - name: Read build number from recorder/VERSION
        id: v
        run: echo "build=$(tr -dc '0-9' < recorder/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: recorder-build-${{ steps.v.outputs.build }}
          name: SwarmRecorder build ${{ steps.v.outputs.build }} (prebuilt)
          body: >-
            Предсобранный SwarmRecorder.app (universal arm64+x86_64, minos 13.0) для установки
            без Xcode/Command Line Tools. Установщик скачивает этот .app и локально переподписывает
            per-machine сертификатом (issue #19).
          files: recorder/SwarmRecorder-${{ steps.v.outputs.build }}.zip
          fail_on_unmatched_files: true

      # Раздача идёт из Supabase Storage, не с GitHub (issue #91: release asset анонимно 404).
      # Раньше заливали руками с service_role из локального CLI, а у него нет прав на ключи
      # (403 api_gateway_keys_read, 24.09.2026). Ключ берём Management API тем же токеном,
      # которым CI раскатывает функции. Проверка — анонимный GET должен отдать 200.
      - name: Upload zip to Supabase Storage (раздача установщику и апдейтеру)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: vbqglndbxkpmreccpqmr
          BUILD: ${{ steps.v.outputs.build }}
        run: |
          set -euo pipefail
          KEY="$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$REF/api-keys?reveal=true" \
            | python3 -c 'import sys,json; print(next(k["api_key"] for k in json.load(sys.stdin) if k.get("name")=="service_role"))')"
          echo "::add-mask::$KEY"
          curl -fsS -X POST "https://$REF.supabase.co/storage/v1/object/swarm_drive/recorder/SwarmRecorder-$BUILD.zip" \
            -H "authorization: Bearer $KEY" -H "content-type: application/zip" -H "x-upsert: true" \
            --data-binary "@recorder/SwarmRecorder-$BUILD.zip" > /dev/null
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' "https://$REF.supabase.co/storage/v1/object/public/swarm_drive/recorder/SwarmRecorder-$BUILD.zip")"
          echo "анонимная раздача SwarmRecorder-$BUILD.zip: HTTP $CODE"
          [ "$CODE" = "200" ]
