# Сторож «MCP снаружи» (#1082, по образцу GarroV/decimus mcp-outside.yml).
#
# Живёт в Actions, а не на площадке: проверка на площадке молчит ровно тогда, когда площадка
# уснула или отвалилась от сети — то есть в единственном случае, ради которого сторож и нужен.
# Проверяет путь снаружи без токена и без секретов (подробности ожиданий — scripts/mcp-outside.sh):
# рукопожатие MCP отвечает, дверь на данные заперта, swarm-setup отдаёт установщик, а отпечаток
# моста из /version совпадает с телом /bridge (иначе само-обновление моста у людей отвергает новую версию).
#
# Красный прогон сам никого не будит, поэтому вердикт доставляется владельцу в Telegram: провал
# и возврат в зелёный — по сообщению. Задач в публичном репозитории не заводит (GarroV/backlog).
#
# Расход: репозиторий публичный, минуты Actions бесплатны; прогон — секунды.
name: MCP снаружи

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      porcha:
        description: "Проверить самого сторожа: подменить адрес заведомо мёртвым и убедиться, что сигнал дошёл"
        type: boolean
        default: false

# Наименьшие права по умолчанию: прогон читает репозиторий и больше ничего. Секрет бота есть
# только у джобы `notify`, где нет ни checkout, ни чужого кода.
permissions:
  contents: read

env:
  ALERT_FAIL: "Swarm: MCP снаружи недоступен."
  ALERT_OK: "Swarm: MCP снаружи снова доступен."

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Проверить дверь и установщик
        env:
          # Корень функций: переменная репозитория MCP_PUBLIC_URL, а без неё — публичный адрес API,
          # уже стоящий в соседних воркфлоу. При проверке на порче подменяется заведомо мёртвым:
          # так видно, что сторож умеет краснеть И что сигнал доходит, а не только что шаг отработал.
          MCP_FUNCTIONS_URL: ${{ inputs.porcha && 'https://127.0.0.1:9' || vars.MCP_PUBLIC_URL || 'https://api.swarm-team.app/functions/v1' }}
        run: ./scripts/mcp-outside.sh

  # Сообщает отдельная джоба: результат пробы приходит через `needs`.
  notify:
    needs: check
    if: always() && (needs.check.result == 'success' || needs.check.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Задач не заводит: репозиторий публичный, наши задачи живут только в приватном
    # GarroV/backlog (решение владельца 15.11.2026). Сигнал уходит владельцу в Telegram,
    # и только при смене состояния — упало / восстановилось, без повтора каждый прогон.
    permissions:
      actions: read
    steps:
      - name: Сообщить владельцу, если состояние сменилось
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAILED: ${{ needs.check.result == 'failure' }}
          TG_TOKEN: ${{ secrets.ALERT_TG_TOKEN }}
          TG_CHAT: ${{ secrets.ALERT_TG_CHAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          prev=$(gh run list --workflow mcp-outside.yml --branch "$GITHUB_REF_NAME" --event "$GITHUB_EVENT_NAME" \
            --status completed -L 1 --json conclusion -q '.[0].conclusion')
          now=ok; [ "$FAILED" = true ] && now=fail
          was=ok; [ -n "$prev" ] && [ "$prev" != success ] && was=fail
          if [ "$now" = "$was" ]; then echo "Состояние прежнее ($now) — молчу."; exit 0; fi
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "::error::Нет секретов ALERT_TG_TOKEN / ALERT_TG_CHAT — оповещение не доставлено."; exit 1
          fi
          if [ "$now" = fail ]; then text="$ALERT_FAIL $RUN_URL"; else text="$ALERT_OK"; fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" --data-urlencode "text=${text}")
          [ "$code" = 200 ] || { echo "::error::Telegram ответил $code — оповещение не доставлено."; exit 1; }
