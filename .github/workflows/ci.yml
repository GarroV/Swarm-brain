name: CI

# Робот-проверяльщик: на каждый push и PR собирает и проверяет код ДО того, как он
# доберётся до пользователей. Зелёная галочка = безопасно, красный крест = поймана поломка.
# Веб (miniapp) выкатывается в прод авто на push в main — этот CI ловит регрессии
# параллельно (сборка + типы + тесты). Рекордер проверяется отдельно (.github/workflows/recorder.yml).

# Правки ТОЛЬКО в `bot/**` здесь не проверяются — у бота свой стек (Node + Playwright) и свой
# workflow `bot.yml`, а Deno и Next к нему отношения не имеют. Фильтр и `bot.yml` заведены ОДНИМ
# изменением: порознь получается дыра — `main` не защищён, и PR без единого чека для ночной
# автоматики выглядит как «претензий нет» (см. шапку bot.yml).
on:
  push:
    branches: [main]
    paths-ignore: ['bot/**']
  pull_request:
    paths-ignore: ['bot/**']
  workflow_dispatch:

# Новый пуш в ту же ветку отменяет предыдущий прогон — устаревший коммит проверять незачем.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protected:
    name: Защищённые разделы (нужно «да» владельца)
    runs-on: ubuntu-latest
    # Только на PR: на push в main сравнивать не с чем — изменение уже влито, а гейт должен
    # срабатывать ДО того, как побочная правка доедет до людей.
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      # Полная история: гейт считает диапазон от точки расхождения с базовой веткой.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Тронуто ли защищённое без разрешения
        run: ./scripts/check-protected-paths.sh origin/${{ github.base_ref }}

  deploy-scripts:
    name: Скрипты раскатки — гейт миграций + порча
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Фикстуры и подставной ответ API — сеть и секреты не нужны. Порча обязательна: она
      # доказывает, что прогон краснеет, когда гейт пропускает код вперёд схемы (issues #444, #557).
      - name: Гейт миграций ночной раскатки
        run: ./scripts/test-migrations-gate.sh porcha
      # Коды проверки «кто в проде» на подставном supabase: упавший запрос обязан давать 3
      # («не смог проверить»), а не 1 («люди работают», обходится FORCE) — issues #437, #438.
      - name: Проверка активности перед раскаткой
        run: ./scripts/test-deploy-activity.sh
      - name: План раскатки — транзитивные потребители _shared
        run: ./scripts/test-deploy-window.sh

  edge:
    name: Edge Functions (Deno) — типы
    runs-on: ubuntu-latest
    # Потолок на случай зависания (сеть, установка Deno): без него job висит до дефолтных
    # 6 часов GitHub. В приватном репозитории такое трижды за день выбило месячную квоту
    # аккаунта (GarroV/multa#148) — Swarm публичный и минуты бесплатны, но зависший прогон
    # всё равно держит очередь и молча тормозит релиз.
    timeout-minutes: 10
    # Тесты функций здесь больше не гоняются (#826): тот же набор (`supabase/`, `files/`) на
    # настоящей базе гоняет гейт доски инициатив, с покрытием. Третий прогон на своём контуре
    # стоил 2,5 минуты раннера и ничего не проверял сверх гейта.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      - name: deno check (все edge-функции)
        run: deno check $(find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts)

  miniapp:
    name: Mini App (Next.js) — сборка + типы
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci
      # next build проверяет и типы, и сборку — то же, что делает Cloudflare Pages, но ДО прода.
      - run: npm run build
      # Юнит-тесты веба (`src/lib/` + `sw.test.ts`, issue #432). Движок — Deno, тот же что у edge-функций: своего
      # раннера тестов у Next тут нет, а заводить второй ради шести файлов незачем. До 2026-08-27
      # эти тесты не гонялись НИГДЕ — ни в CI, ни локально (issue #130), и регрессия в дефолтах
      # задач или в дедупликации запросов проехала бы CI зелёной.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      - run: npm test

  gate:
    name: Гейт доски инициатив (scripts/check + порча)
    runs-on: ubuntu-latest
    # Шесть ролей проверок одной командой: формат, линт, типы, тесты с непадающим покрытием,
    # мёртвый код, границы модулей. Отдельным заданием, а не строчкой в существующих: гейт
    # обязан гоняться сам, а не «когда кто-то вспомнит прогнать его локально».
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Гейт сервера scriba считает затронутые файлы от коммита из .scriba-build-base;
          # в мелком клоне его нет, и формат/линт остались бы без файлов.
          fetch-depth: 0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - name: Зависимости веба (нужны проверке типов)
        working-directory: miniapp
        run: npm ci
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.118.0
      - name: Локальный контур Supabase
        run: ./scripts/ci-supabase-up
      # Области явно: `scripts/check` без аргумента гоняет ещё и бота, а бот проверяется
      # своим workflow (`bot.yml`, там же `npm ci --prefix bot`). Здесь node_modules бота
      # нет, и полный прогон честно покраснел бы на «окружение не поднято».
      # Тесты функций на настоящей базе — только здесь (задание Edge их больше не гоняет, #826).
      # Часть тестов ходит в НАСТОЯЩУЮ базу (приёмка спринта, триггер удаления задачи, гварды
      # роутов, журнал пространства): транзакцию и правило видимости моком не проверить, поэтому
      # пропуск «базы нет» считается падением, а не пропуском.
      - name: Гейт доски инициатив
        run: ./scripts/check initiatives
      # Порча отвечает на вопрос, на который гейт не отвечает: проверяют ли эти проверки хоть
      # что-нибудь. Ломаем ядро и базу нарочно и убеждаемся, что тесты краснеют.
      - name: Порча
        run: make porcha
      - name: Машинный отчёт прогона
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: check-report
          path: reports/

  gate-server:
    name: Гейт сервера scriba (scripts/check server)
    runs-on: ubuntu-latest
    # Отдельным заданием параллельно гейту доски (#826): на одном раннере они шли подряд, и
    # 49 секунд сервера стояли на критическом пути каждого PR. Базу поднимает свою — тесты
    # функций scriba тоже ходят в настоящую.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Затронутые файлы считаются от коммита из .scriba-build-base; в мелком клоне его нет.
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Локальный контур Supabase
        run: ./scripts/ci-supabase-up
      - name: Гейт сервера scriba
        run: ./scripts/check server
      - name: Машинный отчёт прогона
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-report-server
          path: reports/
