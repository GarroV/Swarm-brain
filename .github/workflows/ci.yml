name: CI

# Робот-проверяльщик: на каждый push и PR собирает и проверяет код ДО того, как он
# доберётся до пользователей. Зелёная галочка = безопасно, красный крест = поймана поломка.
# Веб (miniapp) выкатывается в прод авто на push в main — этот CI ловит регрессии
# параллельно (сборка + типы + тесты). Рекордер проверяется отдельно (.github/workflows/recorder.yml).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Новый пуш в ту же ветку отменяет предыдущий прогон — устаревший коммит проверять незачем.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edge:
    name: Edge Functions (Deno) — типы + тесты
    runs-on: ubuntu-latest
    # Потолок на случай зависания (сеть, установка Deno, тест без своего таймаута): без него job
    # висит до дефолтных 6 часов GitHub. В приватном репозитории такое трижды за день выбило
    # месячную квоту аккаунта (GarroV/multa#148) — Swarm публичный и минуты бесплатны, но
    # зависший прогон всё равно держит очередь и молча тормозит релиз. Норма здесь — 2-3 минуты.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: deno check (все edge-функции)
        run: deno check $(find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts)
      - name: deno test
        run: deno test -A supabase/functions/

  miniapp:
    name: Mini App (Next.js) — сборка + типы
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci
      # Хеш inline-скрипта темы в public/_headers должен совпадать со скриптом в layout.tsx,
      # иначе CSP молча запретит его и тема перестанет следовать за системной (issue #100).
      - run: npm run check:csp
      # next build проверяет и типы, и сборку — то же, что делает Cloudflare Pages, но ДО прода.
      - run: npm run build
