name: CI (recorder)

# Рекордер (Swift, macOS) — отдельный workflow: macOS-раннер дорогой, поэтому гоняем
# ТОЛЬКО когда меняется код рекордера. Ловит поломку сборки до тега релиза recorder-build-N
# («плохую сборку не пушим — сломает всю команду», см. recorder/README.md).

on:
  push:
    branches: [main]
    paths: ['recorder/**']
  pull_request:
    paths: ['recorder/**']
  workflow_dispatch:

concurrency:
  group: ci-recorder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: SwarmRecorder — сборка (Swift)
    runs-on: macos-latest
    # macOS-раннер вне бесплатного лимита стоит ×10, поэтому потолок обязателен: зависшая сборка
    # без него крутится 6 часов. Норма — 5-8 минут (см. GarroV/multa#148, чем это кончается).
    timeout-minutes: 25
    defaults:
      run:
        working-directory: recorder
    steps:
      - uses: actions/checkout@v4
      - name: swift build -c release
        run: swift build -c release

      # Чистая логика рекордера (RecorderKit) — XCTest есть только там, где стоит Xcode:
      # на рабочей машине с одними Command Line Tools `swift test` не собирается, поэтому
      # прогон живёт в CI.
      - name: swift test
        run: swift test
