name: CI (bot)

# Бот `scriba` (Node + Playwright, живёт в `bot/`) — отдельный workflow по той же причине,
# что и рекордер: у него свой стек и свои проверки, а корневой `ci.yml` гоняет Deno и Next,
# которым до `bot/` дела нет. Точка входа одна — `scripts/check bot`: её же зовут приёмка
# блока стройки и хук pre-push, поэтому «зелено у меня» и «зелено в CI» означают одно и то же.
#
# ⚠️ Этот workflow — ВТОРАЯ ПОЛОВИНА фильтра путей в `ci.yml` (`paths-ignore: bot/**`),
# и заведён с ним одним изменением. Порознь получается дыра: ветка `main` не защищена
# (`required_status_checks` нет), поэтому PR, у которого не запустился НИ ОДИН чек, для ночной
# автоматики выглядит как `mergeStateStatus=CLEAN` — то есть «претензий нет» — и уезжает
# в прод непроверенным. Убираешь одно — убирай и другое.

on:
  push:
    branches: [main]
    # Списки продублированы, а не сведены YAML-якорем: GitHub Actions якоря в workflow
    # не поддерживает — файл с `&`/`*` он не разбирает вовсе.
    # Сам себя (`.github/workflows/bot.yml`) в путях НЕ перечисляем нарочно: пока `bot/` живёт
    # на ветке стройки, PR, правящий только этот файл, запускал бы прогон там, где проверять
    # нечего — и вставал бы красным на гейте guard'а. Правку самого workflow проверяет
    # следующий PR, который трогает код бота.
    paths:
      - 'bot/**'
      - 'scripts/check'
      - 'scripts/gate-coverage.sh'
  pull_request:
    paths:
      - 'bot/**'
      - 'scripts/check'
      - 'scripts/gate-coverage.sh'
  workflow_dispatch:

# Новый пуш в ту же ветку отменяет прогон устаревшего коммита.
concurrency:
  group: ci-bot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: scriba — формат, линт, типы, тесты, покрытие, мёртвый код, границы
    runs-on: ubuntu-latest
    # Норма — 3-5 минут (установка из лока + шесть ролей проверок). Потолок обязателен на
    # каждом job (канон docs/QUICK_REF.md §CI): без него зависший прогон висит 6 часов.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Ручной запуск (`workflow_dispatch`) может прийти на ветку, где `bot/` ещё нет —
      # тогда честнее красный с внятной причиной, чем `command not found` на пятом шаге.
      #
      # А вот АВТОМАТИЧЕСКИЙ запуск на ветке без `bot/` красным быть не должен, и это не
      # послабление. Пути выше включают `scripts/check` — общий гейт, который правят и вне
      # бота. Пока `bot/` живёт на ветке стройки, любой такой PR получал чек «scriba: fail»
      # с сообщением про отсутствующую папку: правка не при чём, чинить нечего, а ночная
      # автоматика по метке `deploy-window` такой PR не вливает — она берёт только полностью
      # зелёные. Красный, который невозможно погасить работой, блокирует не хуже поломки
      # (issue #497).
      #
      # Поэтому: папки нет — шаг честно говорит, что проверять было нечего, и остальные шаги
      # не выполняются. Это не «пропущенная проверка, выданная за выполненную»: прогонять
      # нечего, потому что кода бота в ветке нет, и summary прогона говорит об этом прямым
      # текстом. Как только ветка бота вольётся, `bot/` окажется на месте и чек оживёт сам,
      # без правок этого файла — ровно так, как задумывало решение от 2026-09-17.
      - name: bot/ и scripts/check на месте
        id: detect
        run: |
          if [ ! -d bot ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::bot/ в этой ветке нет — проверять нечего"
              exit 1
            fi
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "### scriba: проверять нечего" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "В этой ветке нет папки \`bot/\` — кода бота здесь не существует, прогонять нечего." >> "$GITHUB_STEP_SUMMARY"
            echo "Прогон запустился потому, что затронут общий \`scripts/check\`. Чек оживёт вместе с веткой бота." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test -x scripts/check || { echo "::error::scripts/check нет или не исполняемый"; exit 1; }

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.skip != 'true'
        with:
          # `engines` в bot/package.json — `>=22`. Версию фиксируем, чтобы прогон не поехал
          # сам собой при смене дефолта раннера: Playwright-образ бота тоже прибит к версии.
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json

      # `scripts/check bot` КРАСНЕЕТ, когда `bot/node_modules` нет («проверка, которой не было,
      # не должна выглядеть выполненной»), поэтому окружение поднимаем до него — и строго из
      # лока: `npm ci`, а не `npm install`, иначе версии в CI разъезжаются с локальными.
      - if: steps.detect.outputs.skip != 'true'
        run: npm ci --prefix bot

      - if: steps.detect.outputs.skip != 'true'
        run: scripts/check bot
