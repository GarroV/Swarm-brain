name: Секрет вебхука бота (руками)

# Включает проверку секрета вебхука swarm-bot: новый секрет → setWebhook → отбивка → проверка.
# Логика и порядок шагов — scripts/bot-webhook-secret.sh. Повторный запуск безопасен: секрет
# просто перевыпускается и заново сообщается Telegram.

on:
  workflow_dispatch:

concurrency:
  group: deploy-window
  cancel-in-progress: false

jobs:
  secret:
    name: Включить секрет вебхука
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.118.0
      - name: Привязать проект
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref vbqglndbxkpmreccpqmr
      - name: Включить
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: ./scripts/bot-webhook-secret.sh
