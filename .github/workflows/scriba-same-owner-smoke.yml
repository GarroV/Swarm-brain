name: Scriba — две записи одной встречи

# Бот scriba и рекордер того же человека пишут одну встречу и оба выгружают аудио. Правило
# «вторая запись заменяет стенограмму, только если она полнее» держится местом вызова арбитра
# полноты в `_shared/meeting-processor.ts`, очередью выгрузок в бакете и поколением воркера —
# то есть настоящими meeting-claim / meeting-heartbeat / meeting-ingest / meeting-process поверх настоящей базы и
# Storage. Юнит-тесты это целиком не видят: порча «заменять стенограмму всегда» проходила их
# зелёной. Этот прогон поднимает локальный контур (`supabase start`, все миграции) и гоняет смоук
# `scripts/scriba-same-owner-smoke.ts`: функции запускаются как процессы Deno, OpenAI и Telegram
# подменены поддельным сервером внутри смоука. Прод здесь не участвует: база живёт только в раннере.
#
# Запускается только когда тронуто то, от чего зависит правило, — так прогон не жжёт очередь на
# каждой правке веба.

on:
  push:
    branches: [main]
    paths:
      - supabase/migrations/**
      - supabase/config.toml
      - supabase/functions/meeting-claim/**
      - supabase/functions/meeting-heartbeat/**
      - supabase/functions/meeting-ingest/**
      - supabase/functions/meeting-process/**
      - supabase/functions/_shared/**
      - scripts/scriba-same-owner-smoke.ts
      - scripts/scriba-integrity-smoke.ts
      - .github/workflows/scriba-same-owner-smoke.yml
  pull_request:
    paths:
      - supabase/migrations/**
      - supabase/config.toml
      - supabase/functions/meeting-claim/**
      - supabase/functions/meeting-heartbeat/**
      - supabase/functions/meeting-ingest/**
      - supabase/functions/meeting-process/**
      - supabase/functions/_shared/**
      - scripts/scriba-same-owner-smoke.ts
      - scripts/scriba-integrity-smoke.ts
      - .github/workflows/scriba-same-owner-smoke.yml
  workflow_dispatch:

concurrency:
  group: scriba-same-owner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Смоук двух записей одной встречи (живой Postgres + Storage)
    runs-on: ubuntu-latest
    # Норма — 3-4 минуты (скачивание образов + миграции + смоук). Потолок — от зависания.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Та же версия, на которой смоук проверен порчей локально.
          version: 2.118.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Смоуку нужны база, REST и Storage (части аудио лежат в бакете meeting-audio); auth (gotrue)
      # оставлен, потому что без него `supabase status` не отдаёт SERVICE_ROLE_KEY. Функции смоук
      # поднимает сам, поэтому edge-runtime не нужен. Остальное — лишние минуты скачивания.
      - name: Поднять локальную базу со всеми миграциями
        run: >
          supabase start
          -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Смоук двух записей одной встречи
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|SERVICE_ROLE_KEY)=')"
          if [ -z "${API_URL:-}" ] || [ -z "${SERVICE_ROLE_KEY:-}" ]; then
            echo "✘ supabase status не отдал API_URL / SERVICE_ROLE_KEY — смоук не выполнялся"
            exit 1
          fi
          SMOKE_SUPABASE_URL="$API_URL" SMOKE_SERVICE_KEY="$SERVICE_ROLE_KEY" \
            deno run --allow-all scripts/scriba-same-owner-smoke.ts
      # Та же база: записи разных людей и запись после публикации (T168) — владелец идёт со
      # стенограммой, опубликованное не переписывается.
      - name: Смоук целостности записи встречи
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|SERVICE_ROLE_KEY)=')"
          SMOKE_SUPABASE_URL="$API_URL" SMOKE_SERVICE_KEY="$SERVICE_ROLE_KEY" \
            deno run --allow-all scripts/scriba-integrity-smoke.ts
