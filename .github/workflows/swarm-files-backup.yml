name: Swarm files backup - synthetic checks
on:
  pull_request:
    paths:
      - 'scripts/windows/*swarm-task-files.ps1'
      - 'scripts/swarm-files-backup/**'
      - '.github/workflows/swarm-files-backup.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/windows/*swarm-task-files.ps1'
      - 'scripts/swarm-files-backup/**'
      - '.github/workflows/swarm-files-backup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-sender:
    name: Windows PowerShell 5.1 - synthetic capture and send
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read-only source capture, ZIP restore, stability and bounded transport
        shell: powershell
        run: ./scripts/windows/test-backup-swarm-task-files.ps1 -ContractFixtureDirectory "$env:RUNNER_TEMP/swarm-backup-contract"
      - name: Guards reject deliberately broken sender copies
        shell: powershell
        run: ./scripts/windows/test-backup-swarm-task-files.ps1 -NegativeControls
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-dotnet-backup
          path: ${{ runner.temp }}/swarm-backup-contract/*.zip
          if-no-files-found: error
          retention-days: 3
  python-receiver:
    name: Python receiver - integrity and interruption recovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts/swarm-files-backup -p 'test_*.py'
      - run: python3 scripts/swarm-files-backup/check_faults.py
      - name: Parse own systemd unit templates without starting services
        run: |
          unit_dir=$(mktemp -d)
          cp scripts/swarm-files-backup/systemd/* "$unit_dir/"
          printf '[Service]\nType=oneshot\nExecStart=/usr/bin/true\n' > "$unit_dir/tailscaled.service"
          SYSTEMD_UNIT_PATH="$unit_dir:/usr/lib/systemd/system" systemd-analyze verify "$unit_dir/swarm-files-backup-receiver.service" "$unit_dir/swarm-files-backup-receiver.timer"
  contract-roundtrip:
    name: Real dotnet ZIP - Python verification and restore
    needs: [windows-sender, python-receiver]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: synthetic-dotnet-backup
          path: ${{ runner.temp }}/swarm-backup-contract
      - name: Verify and restore exact synthetic Windows archive
        env:
          CONTRACT_FIXTURE: ${{ runner.temp }}/swarm-backup-contract
          RESTORE_ROOT: ${{ runner.temp }}/swarm-backup-restored
        run: |
          python3 - <<'PYCONTRACT'
          import hashlib, json, os, pathlib, subprocess, sys, zipfile
          files = list(pathlib.Path(os.environ['CONTRACT_FIXTURE']).glob('*.zip'))
          assert len(files) == 1
          archive = files[0]
          tool = 'scripts/swarm-files-backup/receiver.py'
          subprocess.run([sys.executable, tool, 'verify', '--archive', str(archive)], check=True)
          root = pathlib.Path(os.environ['RESTORE_ROOT'])
          subprocess.run([sys.executable, tool, 'restore', '--archive', str(archive), '--destination', str(root)], check=True)
          with zipfile.ZipFile(archive) as source:
              manifest = json.loads(source.read('manifest.json').decode('utf-8'))
          expected = {e['path'] for e in manifest['files']}
          assert {str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()} == expected
          for entry in manifest['files']:
              data = (root / entry['path']).read_bytes()
              assert len(data) == entry['size_bytes']
              assert hashlib.sha256(data).hexdigest() == entry['sha256']
          assert manifest['file_count'] == 3
          print(json.dumps({'dotnet_to_python': True, 'file_count': manifest['file_count'], 'total_bytes': manifest['total_bytes']}))
          PYCONTRACT
