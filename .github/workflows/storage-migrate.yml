name: Перенос файлов из публичного бакета (руками)

# Запускает scripts/storage-migrate.ts против прода: файлы команды из публичного swarm_drive →
# приватный swarm_private (реестр storage_files, ссылки в базе). recorder/ скрипт не трогает.
#
# Зачем кнопка: скрипту нужен service_role, а на рабочей машине его нет. Ключ берётся Management
# API тем же токеном, которым CI раскатывает функции (как в recorder-release.yml), и в журнал не
# попадает. Это правка прод-данных: жать в окно раскатки и по порядку фаз —
# plan → copy (apply) → backfill (apply) → verify → cleanup (apply + i_verified).

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Фаза"
        type: choice
        options: [plan, copy, backfill, verify, cleanup]
        default: plan
      apply:
        description: "Применить (без флага — сухой прогон)"
        type: boolean
        default: false
      i_verified:
        description: "cleanup: verify пройден, оригиналы можно удалять"
        type: boolean
        default: false

concurrency:
  group: deploy-window

permissions:
  contents: read

jobs:
  run:
    name: storage-migrate ${{ inputs.phase }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      - name: Фаза
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: vbqglndbxkpmreccpqmr
          PHASE: ${{ inputs.phase }}
          APPLY: ${{ inputs.apply }}
          VERIFIED: ${{ inputs.i_verified }}
        run: |
          set -euo pipefail
          KEY="$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$REF/api-keys?reveal=true" \
            | python3 -c 'import sys,json; print(next(k["api_key"] for k in json.load(sys.stdin) if k.get("name")=="service_role"))')"
          echo "::add-mask::$KEY"
          ARGS=("$PHASE")
          [ "$APPLY" = "true" ] && ARGS+=(--apply)
          [ "$VERIFIED" = "true" ] && ARGS+=(--i-verified)
          SUPABASE_URL="https://$REF.supabase.co" SUPABASE_SERVICE_ROLE_KEY="$KEY" \
            deno run -A scripts/storage-migrate.ts "${ARGS[@]}"
