# Расширенные geo-синонимы (название страны + национальность) для keys_all.yaml.
# Готовы заменить блок strong.geo в каждой стране.
#
# ПРАВИЛА, чтобы не раздувать зря:
# - Русские СКЛОНЕНИЯ не перечисляем — их добирает stem() в match2.py
#   («Венгрия» ловит «Венгрии/Венгрией», «венгерский» → «венгерская/венгерские»).
#   Поэтому здесь только БАЗОВЫЕ формы.
# - Голые ISO-коды (HU, RS, PL) СЮДА НЕ кладём — в теле текста дадут ложные срабатывания
#   («HUb», «ROI»). Код в ЗАГОЛОВКЕ ловится отдельным title-правилом (сильный сигнал).
# - Классы помечены комментарием: [RU] [эндоним] [EN] [translit/искажение] [экзоним].
#   translit/экзонимы сейчас скорее всего 0 попаданий (база — чистая русская речь одного
#   спикера) — это страховка на будущие искажения STT и встречи коллег. Отчёт «попадания
#   на ключ» по живой базе покажет, какие реально стреляют.
# - Всё это geo (вес 2). Коллизий между странами в этих формах нет.

RS:  # Сербия
  geo: [Сербия, сербский, серб, сербы, сербка,                       # [RU]
        Србија, Srbija, српски, srpski, Srbin, Srbi,                 # [эндоним]
        Serbia, Serbian, Serbs,                                      # [EN]
        Сербиа, Србия, Сербья,                                       # [translit/искажение]
        Serbien, Sırbistan, Serbie]                                  # [экзоним: de/tr/fr]

