  .stage { position: relative; flex: 1; min-height: 0; }

  .hint {

  /* ── Detail panel ────────────────────────────────── */
  .panel {

  .panel.open { transform: none; }
  .panel .ph { display: flex; align-items: flex-start; gap: 12px; padding: 18px 18px 14px; }

<script>
(function () {
  "use strict";
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var COLORS = {
    surface: "#E1953A", feature: "#E6CB94", engine: "#6FA0C4", data: "#7FB890", infra: "#B79AD6"
  };
  var CATLABEL = { surface: "Поверхность", feature: "Функция", engine: "Общий движок", data: "Данные", infra: "Инфраструктура" };
  var RADIUS = { surface: 30, feature: 11, engine: 22, data: 21, infra: 19 };

  // ── Surfaces and their features ─────────────────────
  var SURFACES = [
    { id:"bot", label:"Telegram-бот", sub:"swarm-bot", emoji:"📱", x:-640, y:-360,
      desc:"Основной вход: команда сохраняет и спрашивает прямо в чате, где уже общается.",
      feats:[
        { id:"bot_save",  label:"Сохранить знание", desc:"Переслал текст, файл, голос или ссылку — бот сам разбирает и кладёт в базу.", to:["classE"] },
        { id:"bot_ask",   label:"Спросить базу",     desc:"Вопрос на естественном языке → ответ со ссылками на источники.", to:["searchE"] },
        { id:"bot_meet",  label:"Ревью встреч",      desc:"Импортированные встречи (Granola / Read.ai): правка тезисов и подтверждение.", to:["meetE"] },
        { id:"bot_task",  label:"Задачи",            desc:"Создать, назначить, посмотреть свои и командные, сменить статус.", to:["tasks"] },
        { id:"bot_team",  label:"Команда · онбординг", desc:"Профили, роли, рынки, добавление новых участников.", to:["team"] },
        { id:"bot_media", label:"Голос · файлы · ссылки", desc:"Распознавание речи, извлечение содержимого документов, расширение ссылок.", to:["classE"] },
        { id:"bot_fb",    label:"Фидбек",            desc:"Обратная связь от команды уходит в отдельный канал.", to:[] }
      ] },
    { id:"web", label:"Веб «Рой»", sub:"swarm-api · Cloudflare", emoji:"🌐", x:640, y:-360,
      desc:"Доска задач, поиск и вычитка встреч на большом экране. Внутри Telegram или в браузере.",
      feats:[
        { id:"web_board",   label:"Доска задач",   desc:"Четыре вида: Список, Таймлайн (Gantt), Спринты, Граф зависимостей.", to:["tasks"] },
        { id:"web_search",  label:"Умный поиск",   desc:"Семантический поиск с ответом и сносками на источники.", to:["searchE"] },
        { id:"web_review",  label:"Вычитка встреч", desc:"Правка тезисов, выбор «команде / в личное», подтверждение.", to:["meetE"] },
        { id:"web_digest",  label:"Дайджест",      desc:"Персональная сводка по базе за период.", to:["searchE"] },
        { id:"web_profile", label:"Профиль · команда", desc:"Свой профиль, участники, рынки.", to:["team"] },
        { id:"web_admin",   label:"Админка",       desc:"Управление пользователями и воркспейсами (только админ).", to:["ws"] }
      ] },
    { id:"mcp", label:"Claude Desktop", sub:"swarm-mcp", emoji:"🖥️", x:640, y:360,
      desc:"Та же база внутри Claude — для больших текстов с проверкой человеком. Подключение по личному токену (/setup).",
      feats:[
        { id:"mcp_know", label:"Поиск · добавить знание", desc:"Найти, добавить, обновить запись — как инструменты Claude.", to:["searchE","classE"] },
        { id:"mcp_task", label:"Задачи (инструменты)",     desc:"Создать, изменить, посмотреть задачи команды.", to:["tasks"] },
        { id:"mcp_meet", label:"Встречи · команда",        desc:"Список встреч, участники, статистика базы.", to:["meetE","team"] },
        { id:"mcp_file", label:"Файлы",                     desc:"Загрузка файла в хранилище + запись в базе.", to:["kb"] }
      ] },
    { id:"rec", label:"Рекордер встреч", sub:"meeting-*", emoji:"🎙️", x:-640, y:360,
      desc:"Лёгкое macOS-приложение: пишет звук онлайн-звонка, облако расшифровывает, тезисы приходят на вычитку.",
      feats:[
        { id:"rec_record", label:"Запись звонка",        desc:"Системный звук + микрофон во время созвона.", to:["meetE"] },
        { id:"rec_detect", label:"Какая встреча идёт",   desc:"Определяет текущую встречу через календарь и предлагает записать.", to:[] },
        { id:"rec_trans",  label:"Расшифровка + тезисы", desc:"Облако (OpenAI) режет на части, распознаёт речь и собирает тезисы.", to:["meetE","openai"] },
        { id:"rec_queue",  label:"Очередь загрузки",     desc:"Надёжная отправка с повторами; запись хранится локально до подтверждения.", to:["meetE"] }
      ] }
  ];

  // ── Engine (shared), data, infra ────────────────────
  var ENGINE = [
    { id:"classE",  label:"Классификатор", sub:"страны · тип записи", x:0, y:-190,
      desc:"Единые правила: что это (встреча или заметка), к каким странам относится, ключевые слова — для всех поверхностей одинаково.", to:["kb","openai"] },
    { id:"tasks",   label:"Движок задач", sub:"_shared/tasks", x:-180, y:-20,
      desc:"Единый слой работы с задачами — общий для бота, веба и Claude. Сюда же приватность и изоляция.", to:["tk"] },
    { id:"searchE", label:"Семантический поиск", sub:"RAG", x:180, y:-20,
      desc:"Ищет по смыслу (не по словам) и формирует ответ строго по найденным записям со сносками.", to:["kb","openai"] },
    { id:"meetE",   label:"Обработка встреч", sub:"meeting-processor", x:0, y:120,
      desc:"Расшифровка по частям, фильтр тишины, тезисы, автоназвание; затем вычитка и публикация в базу + извлечение задач.", to:["mt","kb","openai","tasks"] }
  ];

  var DATA = [
    { id:"kb",   label:"База знаний", sub:"entries", x:-230, y:300,
      desc:"Все записи команды: встречи и заметки (ссылка/файл — виды заметки). У каждой — смысловой отпечаток для поиска.", to:["supa"] },
    { id:"tk",   label:"Задачи", sub:"tasks", x:30, y:320,
      desc:"Командные и личные дела: исполнитель, срок, приоритет, спринты, зависимости, история статусов.", to:["supa"] },
    { id:"mt",   label:"Встречи рекордера", sub:"meetings", x:280, y:250,
      desc:"Источник истины о записанной встрече: транскрипт, черновик тезисов, кто записал, статус обработки.", to:["supa"] },
    { id:"team", label:"Команда", sub:"users", x:-380, y:170,
      desc:"Профили (имя, роль, рынки, контакты), белый список доступа, интеграции.", to:["supa"] },
    { id:"ws",   label:"Воркспейсы", sub:"рынки CEE / Other", x:-40, y:450,
      desc:"Граница изоляции: каждый видит только свой рынок. Все запросы фильтруются по воркспейсу.", to:["supa"] }
  ];

  var INFRA = [
    { id:"openai", label:"OpenAI", sub:"GPT · embeddings · Whisper", x:0, y:-360,
      desc:"Искусственный интеллект: ответы и тезисы (GPT-4o-mini), смысловой поиск (embeddings), расшифровка речи (Whisper).", to:[] },
    { id:"supa",   label:"Supabase", sub:"Postgres + pgvector", x:0, y:600,
      desc:"Хранилище и бэкенд: база данных с поиском по смыслу (pgvector) и серверные функции.", to:[] },
    { id:"tg",     label:"Telegram", sub:"Bot API", x:-900, y:20,
      desc:"Канал бота и Mini App — где живёт основной вход.", to:[] },
    { id:"cf",     label:"Cloudflare", sub:"Pages", x:900, y:-60,
      desc:"Хостинг веб-приложения «Рой» (статический экспорт).", to:[] }
  ];

  // ── Build node + edge model ─────────────────────────
  var nodes = {}, list = [], edges = [];
  function add(n, cat) { n.cat = cat; n.r = RADIUS[cat]; nodes[n.id] = n; list.push(n); }
  function edge(a, b) { if (a !== b && nodes[a] && nodes[b]) edges.push({ a:a, b:b }); }

  SURFACES.forEach(function (s) {
    add(s, "surface");
    var cnt = s.feats.length;
    // fan features outward (away from map center)
    var baseAng = Math.atan2(s.y, s.x);
    var spread = Math.PI * 0.95;
    var rad = 215;
    s.feats.forEach(function (f, i) {
      var ang = baseAng + (cnt > 1 ? (i / (cnt - 1) - 0.5) * spread : 0);
      f.x = s.x + Math.cos(ang) * rad;
      f.y = s.y + Math.sin(ang) * rad;
      f.parent = s.id;
      add(f, "feature");
      edge(s.id, f.id);
      (f.to || []).forEach(function (t) { f._to = f.to; });
    });
  });
  ENGINE.forEach(function (n) { add(n, "engine"); });
  DATA.forEach(function (n) { add(n, "data"); });
  INFRA.forEach(function (n) { add(n, "infra"); });

  // surface → engines it relies on
  var SURF_ENG = { bot:["searchE","tasks","meetE","classE"], web:["tasks","searchE","meetE"], mcp:["tasks","searchE"], rec:["meetE"] };
  Object.keys(SURF_ENG).forEach(function (s) { SURF_ENG[s].forEach(function (e) { edge(s, e); }); });
  // engine → data / infra
  ENGINE.forEach(function (n) { (n.to || []).forEach(function (t) { edge(n.id, t); }); });
  // data → infra
  DATA.forEach(function (n) { (n.to || []).forEach(function (t) { edge(n.id, t); }); });
  // feature → engine (only where it pins a specific engine, keeps graph honest but light)
  SURFACES.forEach(function (s) { s.feats.forEach(function (f) { (f.to || []).forEach(function (t) { if (nodes[t] && nodes[t].cat !== "surface") edge(f.id, t); }); }); });
  // surface → infra channel
  edge("bot", "tg"); edge("web", "cf"); edge("web", "tg"); edge("mcp", "tg");

  // adjacency
  var adj = {};
  list.forEach(function (n) { adj[n.id] = {}; });
  edges.forEach(function (e) { adj[e.a][e.b] = true; adj[e.b][e.a] = true; });

  // ── Canvas + camera ─────────────────────────────────
  var canvas = document.getElementById("map");
  var ctx = canvas.getContext("2d");
  var W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
  var cam = { s: 1, tx: 0, ty: 0 };
  var hidden = {};          // category -> bool
  var selected = null, hover = null;

  function resize() {
    var r = canvas.parentElement.getBoundingClientRect();
    W = r.width; H = r.height;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function sx(wx) { return wx * cam.s + cam.tx; }
  function sy(wy) { return wy * cam.s + cam.ty; }

  function visible(n) { return !hidden[n.cat]; }

  function fit(animate) {
    var minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9, any = false;
    list.forEach(function (n) {
      if (!visible(n)) return; any = true;
      minX = Math.min(minX, n.x - n.r); maxX = Math.max(maxX, n.x + n.r);
      minY = Math.min(minY, n.y - n.r); maxY = Math.max(maxY, n.y + n.r);
    });
    if (!any) return;
    var pad = 90;
    var sw = (W - pad * 2) / (maxX - minX);
    var sh = (H - pad * 2) / (maxY - minY);
    var target = Math.min(sw, sh, 1.4);
    var cxw = (minX + maxX) / 2, cyw = (minY + maxY) / 2;
    var to = { s: target, tx: W / 2 - cxw * target, ty: H / 2 - cyw * target };
    if (reduce || !animate) { cam = to; return; }
    var from = { s: cam.s, tx: cam.tx, ty: cam.ty }, t0 = null;
    function anim(ts) { if (!t0) t0 = ts; var k = Math.min(1, (ts - t0) / 480); var e = 1 - Math.pow(1 - k, 3);
      cam.s = from.s + (to.s - from.s) * e; cam.tx = from.tx + (to.tx - from.tx) * e; cam.ty = from.ty + (to.ty - from.ty) * e;
      if (k < 1) requestAnimationFrame(anim); }
    requestAnimationFrame(anim);
  }

  function centerOn(n, scaleTo) {
    var s = scaleTo || Math.max(cam.s, 1.05);
    cam.s = s; cam.tx = W / 2 - n.x * s; cam.ty = H / 2 - n.y * s;
  }

  // ── Render ──────────────────────────────────────────
  function draw() {
    ctx.clearRect(0, 0, W, H);

    // background vignette + cluster glows
    var bg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.7);
    bg.addColorStop(0, "#1A160F"); bg.addColorStop(1, "#120F0B");
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    SURFACES.forEach(function (s) {
      if (hidden.surface && hidden.feature) return;
      var gx = sx(s.x), gy = sy(s.y), gr = 300 * cam.s;
      var g = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
      g.addColorStop(0, "rgba(225,149,58,0.10)"); g.addColorStop(1, "rgba(225,149,58,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(gx, gy, gr, 0, 6.283); ctx.fill();
    });
    // core glow (engine/data)
    var cg = ctx.createRadialGradient(sx(0), sy(60), 0, sx(0), sy(60), 360 * cam.s);
    cg.addColorStop(0, "rgba(111,160,196,0.08)"); cg.addColorStop(1, "rgba(111,160,196,0)");
    ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(sx(0), sy(60), 360 * cam.s, 0, 6.283); ctx.fill();

    var focus = selected || hover;
    var lit = null;
    if (focus) { lit = {}; lit[focus.id] = true; for (var k in adj[focus.id]) lit[k] = true; }

    // edges
    edges.forEach(function (e) {
      var a = nodes[e.a], b = nodes[e.b];
      if (!visible(a) || !visible(b)) return;
      var on = lit && (lit[a.id] && lit[b.id]) && (a.id === focus.id || b.id === focus.id);
      if (lit && !on) { ctx.strokeStyle = "rgba(230,220,200,0.04)"; ctx.lineWidth = 1; }
      else if (on) { ctx.strokeStyle = "rgba(225,149,58,0.7)"; ctx.lineWidth = 2; }
      else { ctx.strokeStyle = "rgba(230,220,200,0.12)"; ctx.lineWidth = 1; }
      ctx.beginPath(); ctx.moveTo(sx(a.x), sy(a.y)); ctx.lineTo(sx(b.x), sy(b.y)); ctx.stroke();
    });

    // nodes
    list.forEach(function (n) {
      if (!visible(n)) return;
      var x = sx(n.x), y = sy(n.y), r = n.r * cam.s;
      var dim = lit && !lit[n.id];
      var col = COLORS[n.cat];
      ctx.globalAlpha = dim ? 0.28 : 1;

      // halo for selected
      if (selected && selected.id === n.id) {
        ctx.beginPath(); ctx.arc(x, y, r + 7, 0, 6.283);
        ctx.strokeStyle = "rgba(225,149,58,0.9)"; ctx.lineWidth = 2.5; ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283);
      ctx.fillStyle = col; ctx.fill();
      if (n.cat === "surface" || n.cat === "engine" || n.cat === "data" || n.cat === "infra") {
        ctx.lineWidth = 1.5; ctx.strokeStyle = "rgba(0,0,0,0.25)"; ctx.stroke();
      }
      // emoji on surfaces
      if (n.emoji && r > 16) {
        ctx.globalAlpha = dim ? 0.3 : 1;
        ctx.font = (r * 0.95) + "px " + "system-ui";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(n.emoji, x, y + 1);
      }
      ctx.globalAlpha = 1;

      // label
      var showLabel = n.cat !== "feature" || cam.s > 0.62 || (lit && lit[n.id]) || (hover && hover.id === n.id);
      if (showLabel) {
        ctx.globalAlpha = dim ? 0.35 : 1;
        var big = n.cat === "surface";
        ctx.font = (big ? "700 14px " : (n.cat === "feature" ? "600 11.5px " : "700 12.5px ")) + "var(--sans)";
        ctx.font = (big ? "700 14px " : (n.cat === "feature" ? "600 11.5px " : "700 12.5px ")) + "system-ui, sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "top";
        var ly = y + r + 5;
        var label = n.label;
        ctx.fillStyle = "rgba(0,0,0,0.55)";
        // subtle text shadow for legibility
        ctx.fillText(label, x + 0.6, ly + 0.6);
        ctx.fillStyle = n.cat === "feature" ? "#D8CBB0" : "#F3ECDD";
        ctx.fillText(label, x, ly);
        ctx.globalAlpha = 1;
      }
    });
    ctx.globalAlpha = 1;
  }

  var needsDraw = true;
  function loop() { if (needsDraw) { draw(); needsDraw = false; } requestAnimationFrame(loop); }
  function invalidate() { needsDraw = true; }

  // ── Hit testing ─────────────────────────────────────
  function pick(mx, my) {
    var best = null, bestD = 1e9;
    for (var i = list.length - 1; i >= 0; i--) {
      var n = list[i]; if (!visible(n)) continue;
      var dx = mx - sx(n.x), dy = my - sy(n.y);
      var d = Math.sqrt(dx*dx + dy*dy), hitR = n.r * cam.s + 6;
      if (d <= hitR && d < bestD) { best = n; bestD = d; }
    }
    return best;
  }

  // ── Interaction ─────────────────────────────────────
  var dragging = false, draggingNode = null, panning = false;
  var lastX = 0, lastY = 0, downX = 0, downY = 0, moved = false;

  function rel(e) { var r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

  canvas.addEventListener("pointerdown", function (e) {
    canvas.setPointerCapture(e.pointerId);
    var p = rel(e); lastX = p.x; lastY = p.y; downX = p.x; downY = p.y; moved = false;
    var n = pick(p.x, p.y);
    if (n) { draggingNode = n; } else { panning = true; canvas.classList.add("grabbing"); }
    dragging = true;
  });

  canvas.addEventListener("pointermove", function (e) {
    var p = rel(e);
    if (dragging) {
      var dx = p.x - lastX, dy = p.y - lastY;
      if (Math.abs(p.x - downX) + Math.abs(p.y - downY) > 4) moved = true;
      if (draggingNode) { draggingNode.x += dx / cam.s; draggingNode.y += dy / cam.s; invalidate(); }
      else if (panning) { cam.tx += dx; cam.ty += dy; invalidate(); }
      lastX = p.x; lastY = p.y;
    } else {
      var n = pick(p.x, p.y);
      canvas.classList.toggle("onnode", !!n);
      if (n !== hover) { hover = n; invalidate(); }
    }
  });

  canvas.addEventListener("pointerup", function (e) {
    if (dragging && !moved) {
      var p = rel(e); var n = pick(p.x, p.y);
      if (n) select(n); else deselect();
    }
    dragging = false; draggingNode = null; panning = false; canvas.classList.remove("grabbing");
  });
  canvas.addEventListener("pointercancel", function () { dragging = false; draggingNode = null; panning = false; canvas.classList.remove("grabbing"); });

  canvas.addEventListener("wheel", function (e) {
    e.preventDefault();
    var p = rel(e);
    var wx = (p.x - cam.tx) / cam.s, wy = (p.y - cam.ty) / cam.s;
    var f = e.deltaY < 0 ? 1.12 : 1 / 1.12;
    cam.s = Math.max(0.3, Math.min(3.2, cam.s * f));
    cam.tx = p.x - wx * cam.s; cam.ty = p.y - wy * cam.s;
    invalidate();
  }, { passive: false });

  function zoomBtn(f) {
    var wx = (W/2 - cam.tx) / cam.s, wy = (H/2 - cam.ty) / cam.s;
    cam.s = Math.max(0.3, Math.min(3.2, cam.s * f));
    cam.tx = W/2 - wx * cam.s; cam.ty = H/2 - wy * cam.s; invalidate();
  }
  document.getElementById("zin").onclick = function () { zoomBtn(1.25); };
  document.getElementById("zout").onclick = function () { zoomBtn(1/1.25); };
  document.getElementById("fit").onclick = function () { deselect(); fit(true); invalidate(); };

  // ── Selection + detail panel ────────────────────────
  var panel = document.getElementById("panel");
  function select(n) {
    selected = n; invalidate();
    document.getElementById("p-dot").style.background = COLORS[n.cat];
    document.getElementById("p-dot").textContent = n.emoji || "";
    document.getElementById("p-title").textContent = n.label;
    var cat = document.getElementById("p-cat");
    cat.textContent = CATLABEL[n.cat]; cat.style.color = COLORS[n.cat];
    var meta = document.getElementById("p-meta");
    if (n.sub) { meta.textContent = n.sub; meta.hidden = false; } else { meta.hidden = true; }
    document.getElementById("p-desc").textContent = n.desc || "";

    var neigh = Object.keys(adj[n.id]).map(function (id) { return nodes[id]; })
      .filter(function (m) { return m && visible(m); })
      .sort(function (a, b) { var o = { surface:0, feature:1, engine:2, data:3, infra:4 }; return o[a.cat] - o[b.cat]; });
    var wrap = document.getElementById("p-links-wrap"), ul = document.getElementById("p-links");
    ul.innerHTML = "";
    if (neigh.length) {
      wrap.hidden = false;
      neigh.forEach(function (m) {
        var b = document.createElement("button");
        b.innerHTML = '<i style="background:' + COLORS[m.cat] + '"></i>' + escapeHtml(m.label);
        b.onclick = function () { select(m); centerSoft(m); };
        ul.appendChild(b);
      });
    } else { wrap.hidden = true; }
    panel.classList.add("open");
  }
  function centerSoft(n) {
    // pan node into view if off-screen, keep zoom
    var x = sx(n.x), y = sy(n.y), m = 120;
    if (x < m || x > W - 360 || y < 90 || y > H - m) { cam.tx += (W/2 - x); cam.ty += (H/2 - y); invalidate(); }
  }
  function deselect() { selected = null; panel.classList.remove("open"); invalidate(); }
  document.getElementById("p-close").onclick = deselect;

  function escapeHtml(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  // ── Legend toggles ──────────────────────────────────
  document.querySelectorAll(".lchip").forEach(function (chip) {
    chip.addEventListener("click", function () {
      var cat = chip.getAttribute("data-cat");
      hidden[cat] = !hidden[cat];
      chip.setAttribute("aria-pressed", String(!hidden[cat]));
      if (selected && hidden[selected.cat]) deselect();
      invalidate();
    });
  });

  // ── Search ──────────────────────────────────────────
  var q = document.getElementById("q");
  q.addEventListener("keydown", function (e) { if (e.key === "Enter") jump(); });
  q.addEventListener("input", function () { if (!q.value.trim()) { hover = null; invalidate(); } });
  function jump() {
    var term = q.value.trim().toLowerCase(); if (!term) return;
    var hit = list.filter(function (n) { return visible(n) && (n.label.toLowerCase().indexOf(term) !== -1 || (n.sub||"").toLowerCase().indexOf(term) !== -1); });
    if (!hit.length) return;
    var n = hit[0];
    select(n); centerOn(n, Math.max(cam.s, 1.1)); invalidate();
  }

  // ── Boot ────────────────────────────────────────────
  function start() { resize(); fit(false); invalidate(); }
  start();
  loop();
  var rt;
  window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { resize(); invalidate(); }, 150); });

  // open with the bot surface highlighted as a friendly default
  setTimeout(function () { /* keep clean: no auto-select, just fitted view */ }, 0);
})();
</script>
