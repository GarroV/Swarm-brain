    listAll.forEach(function(n){
      if(!vis(n))return;
      var x=sx(n.x), y=sy(n.y), r=n.r*cam.s, dim=lit && !lit[n.id];
      ctx.globalAlpha = dim?0.22:1;

      if(n.kind==="core"){
        var glow=ctx.createRadialGradient(x,y,r*0.3,x,y,r*1.9);
        glow.addColorStop(0,"rgba(242,184,90,0.55)"); glow.addColorStop(1,"rgba(242,184,90,0)");
        ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(x,y,r*1.9,0,6.283); ctx.fill();
      }
      if(selected && selected.id===n.id){ ctx.beginPath(); ctx.arc(x,y,r+6,0,6.283); ctx.strokeStyle="rgba(242,184,90,0.95)"; ctx.lineWidth=2.5; ctx.setLineDash([]); ctx.stroke(); }

      ctx.beginPath(); ctx.arc(x,y,r,0,6.283); ctx.fillStyle=n.color; ctx.fill();
      ctx.lineWidth=1.2; ctx.strokeStyle="rgba(0,0,0,0.3)"; ctx.stroke();
      if(n.emoji && r>12){ ctx.globalAlpha=dim?0.3:1; ctx.font=(r*0.9)+"px system-ui"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(n.emoji,x,y+1); }
      ctx.globalAlpha=1;

      // label
      var isFunc = n.kind==="func";
      var showLabel = !isFunc || cam.s > 0.55 || (lit && lit[n.id]);
      if(showLabel){
        ctx.globalAlpha = dim?0.3:1;
        var weight = n.kind==="core"?"800 16px ":(n.kind==="cap"?"700 13.5px ":"600 11px ");
        ctx.font = weight+"system-ui, sans-serif";
        ctx.textAlign="center"; ctx.textBaseline="top";
        var ly=y+r+4;
        ctx.fillStyle="rgba(0,0,0,0.62)"; ctx.fillText(n.label,x+0.6,ly+0.6);
        ctx.fillStyle = n.kind==="core"?"#FBE9C8":(n.kind==="cap"?"#F3ECDD":"#D8CDB6");
        ctx.fillText(n.label,x,ly);
        ctx.globalAlpha=1;
      }
    });
    ctx.globalAlpha=1;
  }
  function hexA(hex, a){ var h=hex.replace("#",""); var r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16); return "rgba("+r+","+g+","+b+","+a+")"; }
  function loop(ts){ draw(ts); requestAnimationFrame(loop); }

  // ── Hit testing ─────────────────────────────────────
  function pick(mx,my){
    var best=null,bd=1e9;
    for(var i=listAll.length-1;i>=0;i--){ var n=listAll[i]; if(!vis(n))continue;
      var dx=mx-sx(n.x),dy=my-sy(n.y),d=Math.sqrt(dx*dx+dy*dy),hr=n.r*cam.s+7;
      if(d<=hr && d<bd){ best=n; bd=d; } }
    return best;
  }

  // ── Interaction ─────────────────────────────────────
  var dragging=false,dragNode=null,panning=false,lastX=0,lastY=0,downX=0,downY=0,moved=false;
  function rel(e){ var r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
  canvas.addEventListener("pointerdown",function(e){ canvas.setPointerCapture(e.pointerId); var p=rel(e); lastX=p.x;lastY=p.y;downX=p.x;downY=p.y;moved=false; var n=pick(p.x,p.y); if(n)dragNode=n; else {panning=true;canvas.classList.add("grabbing");} dragging=true; });
  canvas.addEventListener("pointermove",function(e){ var p=rel(e);
    if(dragging){ var dx=p.x-lastX,dy=p.y-lastY; if(Math.abs(p.x-downX)+Math.abs(p.y-downY)>4)moved=true;
      if(dragNode){dragNode.x+=dx/cam.s;dragNode.y+=dy/cam.s;} else if(panning){cam.tx+=dx;cam.ty+=dy;} lastX=p.x;lastY=p.y; }
    else { var n=pick(p.x,p.y); canvas.classList.toggle("onnode",!!n); hover=n; } });
  canvas.addEventListener("pointerup",function(e){ if(dragging&&!moved){ var p=rel(e); var n=pick(p.x,p.y); if(n)select(n); else deselect(); } dragging=false;dragNode=null;panning=false;canvas.classList.remove("grabbing"); });
  canvas.addEventListener("pointercancel",function(){ dragging=false;dragNode=null;panning=false;canvas.classList.remove("grabbing"); });
  canvas.addEventListener("wheel",function(e){ e.preventDefault(); var p=rel(e); var wx=(p.x-cam.tx)/cam.s,wy=(p.y-cam.ty)/cam.s; cam.s=Math.max(0.3,Math.min(4,cam.s*(e.deltaY<0?1.12:1/1.12))); cam.tx=p.x-wx*cam.s; cam.ty=p.y-wy*cam.s; },{passive:false});
  function zoomBtn(f){ var wx=(W/2-cam.tx)/cam.s,wy=(H/2-cam.ty)/cam.s; cam.s=Math.max(0.3,Math.min(4,cam.s*f)); cam.tx=W/2-wx*cam.s; cam.ty=H/2-wy*cam.s; }
  document.getElementById("zin").onclick=function(){ zoomBtn(1.25); };
  document.getElementById("zout").onclick=function(){ zoomBtn(1/1.25); };
  document.getElementById("fit").onclick=function(){ deselect(); fit(true); };

  // ── Panel ───────────────────────────────────────────
  var panel=document.getElementById("panel");
  function select(n){
    selected=n;
    document.getElementById("p-dot").style.background=n.color;
    document.getElementById("p-dot").textContent=n.emoji||"•";
    document.getElementById("p-title").textContent=n.label==="ЯДРО"?"Ядро системы":n.label;
    var cat=document.getElementById("p-cat");
    cat.textContent = n.kind==="core"?"Ядро":(n.kind==="cap"?"Блок возможностей":"Функция · "+n.block);
    cat.style.color = n.color;
    document.getElementById("p-desc").textContent=n.desc||"";

    var wh=document.getElementById("p-where");
    if(n.kind==="func"){
      if(n.auto){ wh.innerHTML="⚙️ <b>Автоматически</b> — внутри ядра, отдельно включать не нужно."; wh.hidden=false; }
      else if(n.where){ wh.innerHTML="<b>Где доступно:</b> "+esc(n.where); wh.hidden=false; }
      else wh.hidden=true;
    } else wh.hidden=true;

    var lw=document.getElementById("p-links-wrap"), ul=document.getElementById("p-links"), lbl=document.getElementById("p-links-lbl");
    ul.innerHTML="";
    if(n.kind==="core"){
      lbl.textContent="Блоки возможностей";
      BLOCKS.forEach(function(b){ if(hiddenBlk[b.id])return; var btn=document.createElement("button"); btn.innerHTML='<i style="background:'+b.color+'"></i>'+esc(b.label); btn.onclick=function(){ select(b); soft(b); }; ul.appendChild(btn); });
      lw.hidden=false;
    } else if(n.kind==="cap"){
      lbl.textContent="Функции блока";
      n.funcs.forEach(function(f){ var btn=document.createElement("button"); btn.innerHTML='<i style="background:'+n.color+'"></i>'+esc(f.label); btn.onclick=function(){ select(f); soft(f); }; ul.appendChild(btn); });
      lw.hidden=false;
    } else {
      lbl.textContent="Блок";
      var p=nodes[n.parent]; var btn=document.createElement("button"); btn.innerHTML='<i style="background:'+p.color+'"></i>'+esc(p.label); btn.onclick=function(){ select(p); soft(p); }; ul.appendChild(btn);
      lw.hidden=false;
    }
    panel.classList.add("open");
  }
  function soft(n){ var x=sx(n.x),y=sy(n.y); if(x<120||x>W-360||y<100||y>H-120){ cam.tx+=(W/2-x); cam.ty+=(H/2-y); } }
  function deselect(){ selected=null; panel.classList.remove("open"); }
  document.getElementById("p-close").onclick=deselect;
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  // ── Search ──────────────────────────────────────────
  var q=document.getElementById("q");
  q.addEventListener("keydown",function(e){ if(e.key==="Enter")jump(); });
  function jump(){ var term=q.value.trim().toLowerCase(); if(!term)return; var hit=listAll.filter(function(n){ return vis(n)&&n.label.toLowerCase().indexOf(term)!==-1; }); if(!hit.length)return; var n=hit[0]; select(n); centerOn(n,Math.max(cam.s,1.3)); }

  // ── Boot ────────────────────────────────────────────
  resize(); fit(false); loop();
  var rt; window.addEventListener("resize",function(){ clearTimeout(rt); rt=setTimeout(resize,150); });
})();
</script>
