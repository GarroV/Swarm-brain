<title>Swarm Brain · Ядро</title>
<meta name="description" content="Ядро Swarm Brain «Рой» глазами пользователя: общая умная память — принимает и не теряет, само раскладывает, находит и отвечает, превращает разговоры в задачи." />

<style>
  :root {
    --bg: #15120E;
    --panel: #211C15;
    --line: #3A3329;
    --ink: #F3ECDD;
    --ink-soft: #C7BCA6;
    --ink-mute: #8E8472;
    --amber: #E1953A;
    --gold: #F2B85A;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 2.5px solid var(--amber); outline-offset: 2px; border-radius: 6px; }
  .app { position: fixed; inset: 0; display: flex; flex-direction: column; }

  .bar {
    display: flex; align-items: center; gap: 12px; padding: 11px 18px;
    background: linear-gradient(180deg, rgba(30,26,20,0.96), rgba(30,26,20,0.84));
    border-bottom: 1px solid var(--line); z-index: 10; backdrop-filter: blur(8px);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -0.02em; font-size: 15px; }
  .brand svg { width: 20px; height: 22px; flex: none; }
  .brand small { font-weight: 500; color: var(--ink-mute); font-size: 12.5px; }
  .tools { display: flex; gap: 6px; margin-left: auto; }
  .tbtn {
    all: unset; cursor: pointer; display: grid; place-items: center; width: 34px; height: 34px;
    border: 1px solid var(--line); border-radius: 9px; color: var(--ink-soft); font-weight: 700; font-size: 16px; transition: background .15s, border-color .15s;
  }
  .tbtn:hover { background: rgba(255,255,255,0.05); border-color: #4b4337; }
  .tbtn.wide { width: auto; padding: 0 12px; font-size: 12.5px; }

  .stage { position: relative; flex: 1; min-height: 0; }
  #map { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  #map.grabbing { cursor: grabbing; }
  #map.onnode { cursor: pointer; }

  .cap {
    position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; z-index: 5; pointer-events: none;
    font-size: 12.5px; color: var(--ink-mute);
  }
  .cap b { color: var(--ink-soft); font-weight: 600; }

  .panel {
    position: absolute; top: 16px; right: 16px; z-index: 8; width: 330px; max-width: calc(100vw - 32px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 24px 60px -24px rgba(0,0,0,0.7);
    transform: translateX(calc(100% + 28px)); transition: transform .28s cubic-bezier(0.16,1,0.3,1);
    overflow: hidden;
  }
  @media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
  .panel.open { transform: none; }
  .panel .ph { display: flex; align-items: flex-start; gap: 13px; padding: 20px 20px 14px; }
  .panel .pdot { width: 46px; height: 46px; border-radius: 13px; flex: none; display: grid; place-items: center; font-size: 24px; }
  .panel .ptitle { font-size: 1.22rem; font-weight: 800; letter-spacing: -0.015em; line-height: 1.18; }
  .panel .pcat { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.12em; margin-top: 5px; color: var(--amber); }
  .panel .pclose { all: unset; cursor: pointer; margin-left: auto; color: var(--ink-mute); font-size: 22px; line-height: 1; padding: 2px 4px; flex: none; }
  .panel .pclose:hover { color: var(--ink); }
  .panel .pbody { padding: 0 20px 22px; }
  .panel .pdesc { font-size: 0.97rem; color: var(--ink-soft); line-height: 1.62; margin: 0; }

  @media (max-width: 560px) {
    .panel { top: auto; bottom: 56px; right: 12px; left: 12px; width: auto; }
  }
</style>

<div class="app">
  <div class="bar">
    <span class="brand">
      <svg viewBox="0 0 20 22" fill="none" aria-hidden="true"><path d="M10 1l8 4.5v11L10 21l-8-4.5v-11z" stroke="#E1953A" stroke-width="1.5" fill="rgba(225,149,58,0.16)"/><circle cx="10" cy="11" r="2.6" fill="#E1953A"/></svg>
      Рой · ядро <small>общая умная память команды</small>
    </span>
    <div class="tools">
      <button class="tbtn" id="zin" title="Приблизить" aria-label="Приблизить">+</button>
      <button class="tbtn" id="zout" title="Отдалить" aria-label="Отдалить">−</button>
      <button class="tbtn wide" id="fit" title="По центру" aria-label="По центру">⤢ Центр</button>
    </div>
  </div>

  <div class="stage">
    <canvas id="map" aria-label="Ядро Swarm Brain и что оно делает"></canvas>
    <div class="cap">🔒 И всё это — <b>в границах твоего рынка</b>; личное остаётся личным</div>

    <aside class="panel" id="panel" aria-live="polite">
      <div class="ph">
        <div class="pdot" id="p-dot"></div>
        <div>
          <div class="ptitle" id="p-title"></div>
          <div class="pcat" id="p-cat"></div>
        </div>
        <button class="pclose" id="p-close" aria-label="Закрыть">×</button>
      </div>
      <div class="pbody"><p class="pdesc" id="p-desc"></p></div>
    </aside>
  </div>
</div>

<script>
(function () {
  "use strict";
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var CORE = { id:"core", core:true, emoji:"🧠", x:0, y:0, r:58, color:"#F2B85A",
    title:"Ядро", cat:"Общая умная память",
    desc:"Ты не настраиваешь его и не обслуживаешь — просто кидаешь в него всё и спрашиваешь. Оно само запоминает, раскладывает и находит. Не нужно думать, куда положить, как назвать и где потом искать." };

  var POINTS = [
    { id:"p1", emoji:"📥", title:"Принимает и не теряет", color:"#E1953A",
      desc:"Кинул что угодно — текст, файл, голос, встречу — и это сохранено навсегда и доступно тем, кому нужно. Не «ещё одно сообщение в чате, которое утонет», а запись в общей памяти." },
    { id:"p2", emoji:"🗂", title:"Само раскладывает по полочкам", color:"#D98A2B",
      desc:"Делает короткие тезисы, помечает рынок и тип записи — без ручной возни с тегами. Ты не структурируешь — оно структурирует за тебя." },
    { id:"p3", emoji:"🔎", title:"Находит по смыслу и отвечает", color:"#E1953A",
      desc:"Спросил по-человечески — получил ответ со ссылками на источники. Даже если сформулировал не теми словами, что были в записи. Не «иди ищи по папкам и переписке»." },
    { id:"p4", emoji:"✅", title:"Превращает разговоры в дела", color:"#D98A2B",
      desc:"Из встречи сами появляются тезисы и задачи с ответственными. Разговор не остаётся «поговорили и забыли» — он превращается в конкретные дела." }
  ];

  var nodes = [CORE], ptR = 300;
  POINTS.forEach(function (p, i) {
    var ang = -Math.PI / 2 + i * (Math.PI * 2 / POINTS.length);
    p.x = Math.cos(ang) * ptR; p.y = Math.sin(ang) * ptR; p.r = 32;
    nodes.push(p);
  });

  var canvas = document.getElementById("map"), ctx = canvas.getContext("2d");
  var W=0,H=0,dpr=Math.min(window.devicePixelRatio||1,2);
  var cam={s:1,tx:0,ty:0}, selected=null, hover=null;

  function resize(){ var r=canvas.parentElement.getBoundingClientRect(); W=r.width; H=r.height; canvas.width=W*dpr; canvas.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  function sx(x){ return x*cam.s+cam.tx; }
  function sy(y){ return y*cam.s+cam.ty; }

  function fit(animate){
    var a=1e9,b=1e9,c=-1e9,d=-1e9;
    nodes.forEach(function(n){ a=Math.min(a,n.x-n.r); c=Math.max(c,n.x+n.r); b=Math.min(b,n.y-n.r); d=Math.max(d,n.y+n.r); });
    var pad=140, target=Math.min((W-pad*2)/(c-a),(H-pad*2)/(d-b),1.5), cxw=(a+c)/2, cyw=(b+d)/2;
    var to={s:target,tx:W/2-cxw*target,ty:H/2-cyw*target};
    if(reduce||!animate){ cam=to; return; }
    var from={s:cam.s,tx:cam.tx,ty:cam.ty},t0=null;
    function an(ts){ if(!t0)t0=ts; var k=Math.min(1,(ts-t0)/480),e=1-Math.pow(1-k,3); cam.s=from.s+(to.s-from.s)*e; cam.tx=from.tx+(to.tx-from.tx)*e; cam.ty=from.ty+(to.ty-from.ty)*e; if(k<1)requestAnimationFrame(an); }
    requestAnimationFrame(an);
  }

  // ── holo helpers ────────────────────────────────────
  function nrand(i){ var a=Math.sin(i*43.137)*4517.31; return a-Math.floor(a); }
  function hexA(hex,a){ var h=hex.replace("#",""); return "rgba("+parseInt(h.substr(0,2),16)+","+parseInt(h.substr(2,2),16)+","+parseInt(h.substr(4,2),16)+","+a+")"; }
  function lighten(hex){ var h=hex.replace("#",""); function up(v){ return Math.round(v+(255-v)*0.55); } return "rgb("+up(parseInt(h.substr(0,2),16))+","+up(parseInt(h.substr(2,2),16))+","+up(parseInt(h.substr(4,2),16))+")"; }
  function flicker(t,ph){ if(reduce) return 1; var v=0.74+0.16*Math.sin(t*0.004+ph)+0.06*Math.sin(t*0.017+ph*2); if(Math.sin(t*0.011+ph*5)>0.968) v*=0.45; return Math.max(0.35,Math.min(1,v)); }
  function wob(t,ph,amp){ if(reduce) return {x:0,y:0}; return { x:Math.sin(t*0.0013+ph)*amp, y:Math.cos(t*0.0017+ph*1.3)*amp }; }

  function draw(ts){
    var t=ts||0;
    ctx.clearRect(0,0,W,H);
    // holographic dark ground
    var bg=ctx.createRadialGradient(sx(0),sy(0),0,sx(0),sy(0),Math.max(W,H)*0.85);
    bg.addColorStop(0,"#12110D"); bg.addColorStop(0.55,"#0C0E0C"); bg.addColorStop(1,"#090A09");
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    // ambient scanlines + moving scan band
    ctx.fillStyle="rgba(120,210,220,0.022)";
    for(var yy=0; yy<H; yy+=4){ ctx.fillRect(0,yy,W,1); }
    if(!reduce){ var band=((t*0.06)%(H+240))-120; var sb=ctx.createLinearGradient(0,band-70,0,band+70); sb.addColorStop(0,"rgba(130,225,235,0)"); sb.addColorStop(0.5,"rgba(130,225,235,0.05)"); sb.addColorStop(1,"rgba(130,225,235,0)"); ctx.fillStyle=sb; ctx.fillRect(0,band-70,W,140); }

    var focus = selected || hover;

    // границы — holographic dashed ring
    var ringR=(ptR+92)*cam.s, rf=flicker(t,1.7);
    ctx.beginPath(); ctx.arc(sx(0),sy(0),ringR,0,6.283);
    ctx.setLineDash([2,9]); if(!reduce) ctx.lineDashOffset=-(t*0.02);
    ctx.strokeStyle=hexA("#9FE6EE",0.30*rf); ctx.lineWidth=1.3; ctx.stroke(); ctx.setLineDash([]); ctx.lineDashOffset=0;

    // energy threads core → points (cyan flow)
    ctx.globalCompositeOperation="lighter";
    POINTS.forEach(function(p,i){
      var ph=nrand(i+50)*6.283, fl=flicker(t,ph);
      var on = focus && (focus.id===p.id||focus.id==="core");
      ctx.beginPath(); ctx.moveTo(sx(0),sy(0)); ctx.lineTo(sx(p.x),sy(p.y));
      if(on){ ctx.strokeStyle=hexA("#CFFBFF",0.85); ctx.lineWidth=2.4; ctx.setLineDash([]); }
      else { ctx.strokeStyle=hexA("#76E0E8",0.34*fl); ctx.lineWidth=1.6; if(!reduce){ ctx.setLineDash([4,11]); ctx.lineDashOffset=-(t*0.05); } }
      ctx.stroke();
    });
    ctx.setLineDash([]); ctx.lineDashOffset=0; ctx.globalCompositeOperation="source-over";

    // nodes as holograms
    nodes.forEach(function(n,idx){
      var ph=nrand(idx+1)*6.283;
      var w=wob(t,ph, n.core?3:6);
      var x=sx(n.x+w.x), y=sy(n.y+w.y), r=n.r*cam.s;
      var dim = focus && focus.id!=="core" && n.id!==focus.id && n.id!=="core";
      var fl=flicker(t,ph), a=(dim?0.3:1)*fl, col=n.color;

      ctx.globalCompositeOperation="lighter";
      // outer bloom
      var br=r*(n.core?2.7:2.15);
      var bloom=ctx.createRadialGradient(x,y,0,x,y,br);
      bloom.addColorStop(0,hexA(col,0.5*a)); bloom.addColorStop(0.5,hexA(col,0.12*a)); bloom.addColorStop(1,hexA(col,0));
      ctx.fillStyle=bloom; ctx.beginPath(); ctx.arc(x,y,br,0,6.283); ctx.fill();
      // translucent body
      ctx.globalAlpha=0.30*a; ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y,r,0,6.283); ctx.fill(); ctx.globalAlpha=1;
      // scanlines inside disc
      ctx.save(); ctx.beginPath(); ctx.arc(x,y,r,0,6.283); ctx.clip();
      var off=reduce?0:((t*0.03)%5);
      ctx.strokeStyle=hexA("#CFFBFF",0.12*a); ctx.lineWidth=1;
      for(var ry=-r; ry<=r; ry+=4){ ctx.beginPath(); ctx.moveTo(x-r,y+ry+off); ctx.lineTo(x+r,y+ry+off); ctx.stroke(); }
      ctx.restore();
      // chromatic split rims
      ctx.globalAlpha=0.5*a; ctx.lineWidth=1.3;
      ctx.strokeStyle="rgba(110,225,238,0.6)"; ctx.beginPath(); ctx.arc(x-1.3,y,r,0,6.283); ctx.stroke();
      ctx.strokeStyle="rgba(240,150,95,0.6)"; ctx.beginPath(); ctx.arc(x+1.3,y,r,0,6.283); ctx.stroke();
      // bright rim
      ctx.globalAlpha=a; ctx.lineWidth=n.core?2.2:1.7; ctx.strokeStyle=hexA(lighten(col),0.9); ctx.beginPath(); ctx.arc(x,y,r,0,6.283); ctx.stroke();
      ctx.globalAlpha=1;
      ctx.globalCompositeOperation="source-over";

      if(selected && selected.id===n.id){ ctx.beginPath(); ctx.arc(x,y,r+9,0,6.283); ctx.setLineDash([4,5]); if(!reduce) ctx.lineDashOffset=-(t*0.03); ctx.strokeStyle="rgba(207,251,255,0.85)"; ctx.lineWidth=2; ctx.stroke(); ctx.setLineDash([]); ctx.lineDashOffset=0; }

      // emoji
      ctx.globalAlpha=(dim?0.45:1)*(0.8+0.2*fl);
      ctx.font=(r*0.82)+"px system-ui"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(n.emoji,x,y+1);
      ctx.globalAlpha=1;

      // holo label (cyan glow)
      ctx.globalAlpha=(dim?0.4:1)*Math.max(0.6,fl);
      ctx.font=(n.core?"800 17px ":"700 14px ")+"system-ui, sans-serif"; ctx.textAlign="center"; ctx.textBaseline="top";
      var ly=y+r+9, lines=n.core?["ЯДРО"]:wrap(n.title,18);
      lines.forEach(function(ln,li){
        ctx.fillStyle="rgba(120,225,238,0.4)"; ctx.fillText(ln, x, ly+li*18+0.5);
        ctx.fillStyle=n.core?"#EAF7F9":"#DCEEF0"; ctx.fillText(ln, x, ly+li*18);
      });
      ctx.globalAlpha=1;
    });
    ctx.globalAlpha=1;
  }
  function wrap(s, max){ var words=s.split(" "), lines=[], cur=""; words.forEach(function(w){ if((cur+" "+w).trim().length>max){ if(cur)lines.push(cur); cur=w; } else cur=(cur+" "+w).trim(); }); if(cur)lines.push(cur); return lines; }
  function loop(ts){ draw(ts); requestAnimationFrame(loop); }

  function pick(mx,my){ for(var i=nodes.length-1;i>=0;i--){ var n=nodes[i]; var dx=mx-sx(n.x),dy=my-sy(n.y); if(Math.sqrt(dx*dx+dy*dy)<=n.r*cam.s+8) return n; } return null; }

  // interaction
  var dragging=false,dragNode=null,panning=false,lastX=0,lastY=0,downX=0,downY=0,moved=false;
  function rel(e){ var r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
  canvas.addEventListener("pointerdown",function(e){ canvas.setPointerCapture(e.pointerId); var p=rel(e); lastX=p.x;lastY=p.y;downX=p.x;downY=p.y;moved=false; var n=pick(p.x,p.y); if(n)dragNode=n; else {panning=true;canvas.classList.add("grabbing");} dragging=true; });
  canvas.addEventListener("pointermove",function(e){ var p=rel(e);
    if(dragging){ var dx=p.x-lastX,dy=p.y-lastY; if(Math.abs(p.x-downX)+Math.abs(p.y-downY)>4)moved=true; if(dragNode){dragNode.x+=dx/cam.s;dragNode.y+=dy/cam.s;} else if(panning){cam.tx+=dx;cam.ty+=dy;} lastX=p.x;lastY=p.y; }
    else { var n=pick(p.x,p.y); canvas.classList.toggle("onnode",!!n); hover=n; } });
  canvas.addEventListener("pointerup",function(e){ if(dragging&&!moved){ var p=rel(e); var n=pick(p.x,p.y); if(n)select(n); else deselect(); } dragging=false;dragNode=null;panning=false;canvas.classList.remove("grabbing"); });
  canvas.addEventListener("pointercancel",function(){ dragging=false;dragNode=null;panning=false;canvas.classList.remove("grabbing"); });
  canvas.addEventListener("wheel",function(e){ e.preventDefault(); var p=rel(e); var wx=(p.x-cam.tx)/cam.s,wy=(p.y-cam.ty)/cam.s; cam.s=Math.max(0.4,Math.min(3,cam.s*(e.deltaY<0?1.12:1/1.12))); cam.tx=p.x-wx*cam.s; cam.ty=p.y-wy*cam.s; },{passive:false});
  function zoomBtn(f){ var wx=(W/2-cam.tx)/cam.s,wy=(H/2-cam.ty)/cam.s; cam.s=Math.max(0.4,Math.min(3,cam.s*f)); cam.tx=W/2-wx*cam.s; cam.ty=H/2-wy*cam.s; }
  document.getElementById("zin").onclick=function(){ zoomBtn(1.25); };
  document.getElementById("zout").onclick=function(){ zoomBtn(1/1.25); };
  document.getElementById("fit").onclick=function(){ deselect(); fit(true); };

  // panel
  var panel=document.getElementById("panel");
  function select(n){
    selected=n;
    document.getElementById("p-dot").style.background=n.color;
    document.getElementById("p-dot").textContent=n.emoji;
    document.getElementById("p-title").textContent=n.core?"Ядро":n.title;
    document.getElementById("p-cat").textContent=n.core?n.cat:"Что делает ядро";
    document.getElementById("p-desc").textContent=n.desc;
    panel.classList.add("open");
  }
  function deselect(){ selected=null; panel.classList.remove("open"); }
  document.getElementById("p-close").onclick=deselect;

  resize(); fit(false); loop();
  var rt; window.addEventListener("resize",function(){ clearTimeout(rt); rt=setTimeout(resize,150); });
})();
</script>
