  function drawGalaxy(t){

      dx=r*Math.cos(a); dy=r*Math.sin(a)*incl; x=cx+dx*cosT-dy*sinT; y=cy+dx*sinT+dy*cosT;

    } else if(g==="board"){
      ctx.strokeRect(x-s*0.6,y-s*0.5,s*1.2,s*1.0);
      ctx.beginPath(); ctx.moveTo(x-s*0.2,y-s*0.5); ctx.lineTo(x-s*0.2,y+s*0.5); ctx.moveTo(x+s*0.2,y-s*0.5); ctx.lineTo(x+s*0.2,y+s*0.5); ctx.stroke();
      ctx.fillRect(x-s*0.5,y-s*0.34,s*0.22,s*0.16); ctx.fillRect(x-s*0.11,y-s*0.34,s*0.22,s*0.16); ctx.fillRect(x+s*0.28,y-s*0.34,s*0.22,s*0.16);
    } else { ctx.beginPath(); ctx.arc(x,y,s*0.4,0,6.283); ctx.stroke(); }
    ctx.restore();
  }

  function drawNode(n, t){
    var ph=n.ph;
    var hovd=(hover&&hover.id===n.id)||(selected&&selected.id===n.id);
    n.hs += ((hovd?1:0)-n.hs)*(reduce?1:0.2);   // плавное увеличение при наведении
    var x=sx(n._vx), y=sy(n._vy), r=n.r*cam.s*(1+0.16*n.hs);
    var dim = curLit && !curLit[n.id];
    var fl=waveFlicker(t,n), a=(dim?0.30:1)*fl;
    var isCore=n.kind==="core";
    var rim = isCore?"#F2B85A":"#E1953A", gly = isCore?"#FBE3A6":"#F4C46A";

    // янтарный блум (приглушённый)
    ctx.globalCompositeOperation="lighter";
    var br=r*(isCore?2.3:1.8);
    var bloom=ctx.createRadialGradient(x,y,0,x,y,br);
    bloom.addColorStop(0,hexA(rim,0.26*a)); bloom.addColorStop(0.5,hexA(rim,0.06*a)); bloom.addColorStop(1,hexA(rim,0));
    ctx.fillStyle=bloom; ctx.beginPath(); ctx.arc(x,y,br,0,6.283); ctx.fill();
    ctx.globalCompositeOperation="source-over";

    // тёмное тело-чип («жёлтое на чёрном»)
    ctx.globalAlpha=a;
    ctx.fillStyle="rgba(11,10,7,0.84)"; ctx.beginPath(); ctx.arc(x,y,r,0,6.283); ctx.fill();
    // тонкие янтарные сканлайны (ретро-консоль)
    ctx.save(); ctx.beginPath(); ctx.arc(x,y,r,0,6.283); ctx.clip();
    var off=reduce?0:((t*0.025)%5); ctx.strokeStyle=hexA(gly,0.07*a); ctx.lineWidth=1;
    for(var ry=-r; ry<=r; ry+=4){ ctx.beginPath(); ctx.moveTo(x-r,y+ry+off); ctx.lineTo(x+r,y+ry+off); ctx.stroke(); }
    ctx.restore();
    // янтарный обод
    ctx.strokeStyle=hexA(rim,0.92); ctx.lineWidth=isCore?2.4:1.6; ctx.beginPath(); ctx.arc(x,y,r,0,6.283); ctx.stroke();
    ctx.globalAlpha=1;

    if(selected && selected.id===n.id){ ctx.beginPath(); ctx.arc(x,y,r+8,0,6.283); ctx.setLineDash([4,5]); if(!reduce)ctx.lineDashOffset=-(t*0.03); ctx.strokeStyle=hexA("#FBE3A6",0.9); ctx.lineWidth=2; ctx.stroke(); ctx.setLineDash([]); ctx.lineDashOffset=0; }

    // пиктограмма
    if(r>9){ ctx.globalAlpha=(dim?0.5:1)*(0.85+0.15*fl); drawGlyph(GLYPHS[n.id]||"check", x, y, r*0.5, gly, Math.max(1.2, r*0.085)); ctx.globalAlpha=1; }

    // подпись: у мини-нод (функций) текст скрывается на отдалении (плавно), видны только главные сферы;
    // при зуме/наведении — возвращается. Главные ноды (ядро/точки/двери) подписаны всегда.
    var lm = (n.kind!=="func") ? 1 : (n.hs>0.04 ? 1 : Math.max(0, Math.min(1,(cam.s-0.8)/0.12)));
    if(lm>0.01){
      var big=isCore||n.kind==="door";
      ctx.font=(isCore?"800 17px ":(big?"700 15px ":"600 11.5px "))+"system-ui, sans-serif";
      ctx.textAlign="center"; ctx.textBaseline="top";
      var ly=y+r+9, lines=isCore?["ЯДРО"]:wrap(n.title, big?16:14), lh=big?17:15, maxw=0;
      lines.forEach(function(ln){ var w=ctx.measureText(ln).width; if(w>maxw)maxw=w; });
      var la=(dim?0.4:1)*Math.max(0.7,fl)*lm;
      if(n.hs>0.02){
        ctx.save();
        if('filter' in ctx){ try{ ctx.filter="blur(7px)"; }catch(e){} }
        ctx.globalAlpha=la*0.45*n.hs;
        ctx.fillStyle="#070705";
        var bw=maxw+24, bh=lines.length*lh+16, bx=x-bw/2, byy=ly-8;
        if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(bx,byy,bw,bh,11); ctx.fill(); } else ctx.fillRect(bx,byy,bw,bh);
        ctx.restore();
      }
      ctx.globalAlpha=la;
      ctx.fillStyle=isCore?"#FBE3A6":"#EBDCB6";
      ctx.shadowColor="rgba(0,0,0,0.55)"; ctx.shadowBlur=3;
      lines.forEach(function(ln,li){ ctx.fillText(ln,x,ly+li*lh); });
      ctx.shadowBlur=0; ctx.shadowColor="transparent";
      ctx.globalAlpha=1;
    }
  }

  // ── Render ──────────────────────────────────────────
  function draw(ts){
    var t=ts||0;
    // лёгкий дрейф нод — общая позиция для узла И концов линий (линии держатся за узлы)
    list.forEach(function(n){ var w=wob(t,n.ph,n.amp); n._vx=n.x+w.x; n._vy=n.y+w.y; });
    ctx.clearRect(0,0,W,H);
    var bg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.9);
    bg.addColorStop(0,"#101108"); bg.addColorStop(0.55,"#0A0C0A"); bg.addColorStop(1,"#070806");
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    drawGalaxy(t);
    ctx.fillStyle="rgba(120,210,220,0.018)"; for(var yy=0; yy<H; yy+=4){ ctx.fillRect(0,yy,W,1); }
    if(!reduce){ var band=((t*0.06)%(H+240))-120; var sb=ctx.createLinearGradient(0,band-70,0,band+70); sb.addColorStop(0,"rgba(130,225,235,0)"); sb.addColorStop(0.5,"rgba(130,225,235,0.05)"); sb.addColorStop(1,"rgba(130,225,235,0)"); ctx.fillStyle=sb; ctx.fillRect(0,band-70,W,140); }

    drawSwarm(t);

    var focus=selected||hover;
    curLit = focus ? litSet(focus) : null;

    // ── «Область ядра» — единое целое: заливка + контур ──
    var cxs=sx(0), cys=sy(0), aR=AREA_R*cam.s;
    var areaGlow=ctx.createRadialGradient(cxs,cys,0,cxs,cys,aR);
    areaGlow.addColorStop(0,"rgba(242,184,90,0.10)"); areaGlow.addColorStop(0.7,"rgba(225,149,58,0.05)"); areaGlow.addColorStop(1,"rgba(225,149,58,0)");
    ctx.fillStyle=areaGlow; ctx.beginPath(); ctx.arc(cxs,cys,aR,0,6.283); ctx.fill();
    var rf=flicker(t,1.7);
    ctx.beginPath(); ctx.arc(cxs,cys,aR,0,6.283); ctx.setLineDash([2,9]); if(!reduce)ctx.lineDashOffset=-(t*0.02);
    ctx.strokeStyle=hexA("#E7C77A",0.34*rf); ctx.lineWidth=1.4; ctx.stroke(); ctx.setLineDash([]); ctx.lineDashOffset=0;

    // core pulse glow
    var pulse=reduce?1:(1+0.06*Math.sin(t*0.0024));
    var cg=ctx.createRadialGradient(cxs,cys,0,cxs,cys,260*cam.s*pulse);
    cg.addColorStop(0,"rgba(242,184,90,0.16)"); cg.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(cxs,cys,260*cam.s*pulse,0,6.283); ctx.fill();

    // ── threads ──
    ctx.globalCompositeOperation="lighter";
    // core → points (концы — по «колыхнутым» позициям, чтобы держались за шарики)
    POINTS.forEach(function(p){ var on=focus&&(focus.id===p.id||focus.id==="core"); thread(t, sx(CORE._vx),sy(CORE._vy), sx(p._vx),sy(p._vy), on, false); });
    // двери: ствол ОБЛАСТЬ→дверь + функции (импульсы по смыслу: «вносит» иконка→ядро, «достаёт» ядро→иконка)
    DOORS.forEach(function(d){ var door=d.node;
      var ang=Math.atan2(door.y, door.x), ex=Math.cos(ang)*AREA_R, ey=Math.sin(ang)*AREA_R;
      var trunkOn = focus && (focus.id===door.id || focus.parent===door.id);
      thread(t, sx(ex),sy(ey), sx(door._vx),sy(door._vy), !!trunkOn, true);
      d.funcs.forEach(function(f){ var on=focus&&(focus.id===f.id||focus.id===door.id);
        if(f.flow==="out") thread(t, sx(door._vx),sy(door._vy), sx(f._vx),sy(f._vy), on, false);
        else thread(t, sx(f._vx),sy(f._vy), sx(door._vx),sy(door._vy), on, false);
      });
    });
    ctx.globalCompositeOperation="source-over";

    // ── nodes ──
    list.forEach(function(n){ drawNode(n,t); });
  }
  function loop(ts){ draw(ts); requestAnimationFrame(loop); }

  // ── Hit + interaction ───────────────────────────────
  function pick(mx,my){ for(var i=list.length-1;i>=0;i--){ var n=list[i]; var dx=mx-sx(n.x),dy=my-sy(n.y); if(Math.sqrt(dx*dx+dy*dy)<=n.r*cam.s+8) return n; } return null; }
  var dragging=false,dragNode=null,panning=false,lastX=0,lastY=0,downX=0,downY=0,moved=false;
  function rel(e){ var r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
  canvas.addEventListener("pointerdown",function(e){ canvas.setPointerCapture(e.pointerId); var p=rel(e); lastX=p.x;lastY=p.y;downX=p.x;downY=p.y;moved=false; var n=pick(p.x,p.y); if(n)dragNode=n; else {panning=true;canvas.classList.add("grabbing");} dragging=true; });
  canvas.addEventListener("pointermove",function(e){ var p=rel(e);
    if(dragging){ var dx=p.x-lastX,dy=p.y-lastY; if(Math.abs(p.x-downX)+Math.abs(p.y-downY)>4)moved=true; if(dragNode){dragNode.x+=dx/cam.s;dragNode.y+=dy/cam.s;} else if(panning){cam.tx+=dx;cam.ty+=dy;} lastX=p.x;lastY=p.y; }
    else { var n=pick(p.x,p.y); canvas.classList.toggle("onnode",!!n); hover=n; } });
  canvas.addEventListener("pointerup",function(e){ if(dragging&&!moved){ var p=rel(e); var n=pick(p.x,p.y); if(n)select(n); else deselect(); } dragging=false;dragNode=null;panning=false;canvas.classList.remove("grabbing"); });
  canvas.addEventListener("pointercancel",function(){ dragging=false;dragNode=null;panning=false;canvas.classList.remove("grabbing"); });
  canvas.addEventListener("wheel",function(e){ e.preventDefault(); var p=rel(e); var wx=(p.x-cam.tx)/cam.s,wy=(p.y-cam.ty)/cam.s; cam.s=Math.max(0.35,Math.min(3,cam.s*(e.deltaY<0?1.12:1/1.12))); cam.tx=p.x-wx*cam.s; cam.ty=p.y-wy*cam.s; },{passive:false});
  function zoomBtn(f){ var wx=(W/2-cam.tx)/cam.s,wy=(H/2-cam.ty)/cam.s; cam.s=Math.max(0.35,Math.min(3,cam.s*f)); cam.tx=W/2-wx*cam.s; cam.ty=H/2-wy*cam.s; }
  document.getElementById("zin").onclick=function(){ zoomBtn(1.25); };
  document.getElementById("zout").onclick=function(){ zoomBtn(1/1.25); };
  document.getElementById("fit").onclick=function(){ deselect(); fit(true); };

  // ── Panel ───────────────────────────────────────────
  var panel=document.getElementById("panel");
  function catLabel(n){ return n.kind==="core"?n.cat:(n.kind==="point"?"Что делает ядро":(n.kind==="door"?n.cat:(n.flow==="out"?"Достаёт из ядра":"Вносит в ядро"))); }
  function select(n){
    selected=n;
    document.getElementById("p-dot").style.background=n.color;
    document.getElementById("p-dot").textContent=n.emoji;
    document.getElementById("p-title").textContent=n.kind==="core"?"Ядро":n.title;
    var cat=document.getElementById("p-cat"); cat.textContent=catLabel(n); cat.style.color=n.color;
    document.getElementById("p-desc").textContent=n.desc;
    var lw=document.getElementById("p-links-wrap"), ul=document.getElementById("p-links"), lbl=document.getElementById("p-links-lbl");
    ul.innerHTML="";
    if(n.kind==="door"){
      lbl.textContent="Что можно делать";
      list.filter(function(m){ return m.parent===n.id; }).forEach(function(f){ var b=document.createElement("button"); b.innerHTML='<i style="background:'+(f.color||"#E6C281")+'"></i>'+esc(f.title); b.onclick=function(){ select(f); soft(f); }; ul.appendChild(b); });
      lw.hidden=false;
    } else if(n.kind==="func"){
      var par=nodes[n.parent]; lbl.textContent="Через"; var b=document.createElement("button"); b.innerHTML='<i style="background:'+(par.color||"#5FC9D6")+'"></i>'+esc(par.title); b.onclick=function(){ select(par); soft(par); }; ul.appendChild(b); lw.hidden=false;
    } else if(n.kind==="core"){
      lbl.textContent="Возможности"; POINTS.forEach(function(p){ var b=document.createElement("button"); b.innerHTML='<i style="background:'+p.color+'"></i>'+esc(p.title); b.onclick=function(){ select(p); soft(p); }; ul.appendChild(b); }); lw.hidden=false;
    } else lw.hidden=true;
    panel.classList.add("open");
  }
  function soft(n){ var x=sx(n.x),y=sy(n.y); if(x<120||x>W-360||y<100||y>H-120){ cam.tx+=(W/2-x); cam.ty+=(H/2-y); } }
  function deselect(){ selected=null; panel.classList.remove("open"); }
  document.getElementById("p-close").onclick=deselect;
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  resize(); fit(false); loop();
  var rt; window.addEventListener("resize",function(){ clearTimeout(rt); rt=setTimeout(resize,150); });
})();
</script>
