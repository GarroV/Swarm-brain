<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- стенд раздаётся коллегам по ссылке, но это черновик интерфейса, а не продукт: в поиске ему делать нечего -->
<meta name="robots" content="noindex,nofollow">
<title>Swarm — стенд редизайна</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- шрифты подключены НЕ блокирующе: обычный rel=stylesheet с чужого хоста держит первую
     отрисовку до ответа сети — стенд, открытый с файла без сети, показывал пустой экран,
     а прогон проверки успевал замерить страницу до отрисовки и врал -->
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'">
<!-- значок вкладки рисуем тут же: без него браузер просит /favicon.ico и получает 404,
     а у человека, которому дали ссылку, в консоли лежит ошибка на ровном месте -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%231B2028%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27Helvetica,Arial%27 font-size=%2718%27 font-weight=%27700%27 fill=%27white%27 text-anchor=%27middle%27%3ES%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
