*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);

.tabs{display:flex;gap:6px;margin:18px 0 8px;flex-wrap:wrap}

select,input[type=text]{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);

.btn{border:1px solid var(--plum);background:var(--plum);color:#fff;padding:7px 13px;border-radius:8px;

.btn.gh{background:transparent;color:var(--plum)}
.btn.warn{border-color:var(--amber);background:var(--amber);color:#fff}

.banner.info{background:var(--plum-w);border:1px solid #D8C9EE;color:var(--plum-d)}
.banner.done{background:var(--green-w);border:1px solid #BFE3CE;color:#14522F}
.dir{margin:20px 0 8px;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--plum)}

.ih .ow{font-size:11px;color:var(--faint);display:block;font-weight:400;margin-top:2px}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--paper);color:var(--soft);white-space:nowrap}
.pill.ok{background:var(--green-w);color:var(--green)}
.pill.risk{background:var(--red-w);color:var(--red)}
.mini{width:70px;height:6px;background:var(--line);border-radius:99px;overflow:hidden;flex:0 0 auto}
.mini i{display:block;height:100%;background:var(--green)}

.task{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-left:3px solid var(--line);

.task.sp{border-left-color:var(--plum);background:#FCFAFF}
.task.done{border-left-color:var(--green);background:var(--green-w)}

.task.over{border-left-color:var(--red)}

.task .t{font-size:12.5px;line-height:1.35}

.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center}
.tag{font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:99px;white-space:nowrap}

function ownColor(o){o=o||"";if(FIX[o]!==undefined)return PAL[FIX[o]];

 try{const p=await window.storage.get(KEY+"-me",false);if(p&&p.value)ME=p.value;}catch(e){}
 if(!st.sprints||!st.sprints.length)
  st.sprints=[{n:1,start:"2026-09-08",end:"2026-09-21",freeze:"2026-09-22T10:00",closed:false}];
 st.sprints.forEach(sp=>{if(!sp.check)sp.check=addD(sp.start,6);});}
async function setMe(v){ME=v;try{await window.storage.set(KEY+"-me",v,false);}catch(e){}}
function save(){const el=document.getElementById("save");el.textContent="сохраняю…";
 clearTimeout(timer);timer=setTimeout(async()=>{try{const r=await window.storage.set(KEY,JSON.stringify(st),SHARED);

function logIt(act,t,detail){st.log=st.log||[];
 st.log.unshift({ts:Date.now(),act:act,task:t?(t.t||""):"",ini:t?(t.ini||""):"",detail:detail||""});
 if(st.log.length>800)st.log.length=800;}

function eff(b,ini,dir){return Object.assign({dir:dir,ini:ini},b,st.edit[b.id]||{});}
function tasksOf(d,i){const out=[];
 i.tasks.forEach(b=>{if(!st.deleted[b.id])out.push(eff(b,i.name,d.name));});
 (st.added[i.name]||[]).forEach(b=>{if(!st.deleted[b.id])out.push(eff(b,i.name,d.name));});
 return out;}
let T=[];
function buildAll(){T=[];DATA.forEach(d=>d.inis.forEach(i=>tasksOf(d,i).forEach(t=>T.push(t))));}
const sprintOf=t=>st.sprintOf[t.id]!==undefined?st.sprintOf[t.id]:(t.s1?1:0);
const stat=t=>st.status[t.id]||"";
const overdue=t=>stat(t)!=="done"&&t.e<TODAY;
const fmt=d=>d?d.split("-").reverse().join("."):"";
const active=()=>st.sprints.find(s=>!s.closed)||st.sprints[st.sprints.length-1];
function frozen(sp){if(sp.closed)return true;if(st.unlock[sp.n])return false;
 const now=new Date();const iso=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+
  String(now.getDate()).padStart(2,"0")+"T"+String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
 return iso>=sp.freeze;}
function counts(l){const done=l.filter(t=>stat(t)==="done").length,moved=l.filter(t=>stat(t)==="moved").length,
 over=l.filter(overdue).length;return{n:l.length,done,moved,over,pct:l.length?Math.round(done/l.length*100):0};}
function match(t){if(who&&t.own!==who)return false;
 if(q&&!((t.t||"").toLowerCase().includes(q)||(t.ini||"").toLowerCase().includes(q)))return false;return true;}
function addD(d,n){const x=new Date(d+"T00:00:00");x.setDate(x.getDate()+n);return x.toISOString().slice(0,10);}

function closeSprint(sp){
 const list=T.filter(t=>sprintOf(t)===sp.n);
 sp.rows=list.map(t=>({id:t.id,t:t.t,own:t.own,ini:t.ini,e:t.e,
  status:stat(t),reason:st.reason[t.id]||"",carried:st.carried[t.id]||"",
  check:(st.check[t.id]||{}).s||"",checknote:(st.check[t.id]||{}).note||""}));
 const c=counts(list);
 sp.summary={n:c.n,done:c.done,moved:c.moved,none:c.n-c.done-c.moved,pct:c.pct,closedAt:Date.now()};
 sp.closed=true;
 const ns={n:sp.n+1,start:addD(sp.end,1),end:addD(sp.end,14),freeze:addD(sp.end,15)+"T10:00",
  check:addD(sp.end,7),closed:false};
 st.sprints.push(ns);
 list.forEach(t=>{const s=stat(t);if(s==="done")return;
  st.sprintOf[t.id]=ns.n;st.carried[t.id]=(s==="moved")?"manual":"auto";st.status[t.id]="";
  delete st.check[t.id];});
 logIt("спринт "+sp.n+" закрыт",{t:"Выполнено "+c.done+" из "+c.n},"в спринт "+ns.n+" ушло "+(c.n-c.done));
 view="s"+ns.n;save();render();}

    c.done+"/"+c.n+(c.over?" · "+c.over+" просроч.":"")+'</span></div><div class="tasks '+(open?"":"hid")+'"></div>';
   const tw=box.querySelector(".tasks");
   l.forEach(t=>{const row=document.createElement("div");
    row.style.cssText="display:flex;gap:6px;align-items:flex-start";
    const el=taskEl(t);el.style.flex="1";row.append(el);
    if(!editMode&&sprintOf(t)!==sp.n){const a=document.createElement("button");a.className="tosp";
     a.textContent="в спринт "+sp.n;
     a.onclick=()=>{st.sprintOf[t.id]=sp.n;delete st.carried[t.id];
      logIt("добавлена в спринт "+sp.n,t,"");save();render();};row.append(a);}
    tw.append(row);});
   if(editMode){const add=document.createElement("button");add.className="addbtn";add.textContent="+ добавить задачу";
    add.onclick=e=>{e.stopPropagation();st.added[i.name]=st.added[i.name]||[];
     const nid="n"+Date.now()+(++seq);
     st.added[i.name].push({id:nid,t:"Новая задача",own:i.own,s:TODAY,e:i.end,s1:0});
     who="";q="";document.getElementById("who").value="";document.getElementById("q").value="";
     logIt("добавлена задача",{t:"Новая задача",ini:i.name},"");save();buildAll();render();
     const f=document.querySelector('[data-tid="'+nid+'"] .et');if(f){f.focus();f.select();f.scrollIntoView({block:"center"});}};
    tw.append(add);}
   box.querySelector(".ih").onclick=()=>{if(editMode)return;
    st.open[i.name]=!(st.open[i.name]!==false);save();render();};
   v.append(box);});});
 if(!shown&&!editMode)v.innerHTML='<div class="empty">Под этот фильтр ничего не попало.</div>';}

function anView(){
 const v=document.getElementById("view");v.innerHTML="";
 const hist=st.sprints.filter(s=>s.closed);
 if(hist.length){const h=document.createElement("div");
  h.innerHTML='<div class="sect">История спринтов</div><table class="an">'+
   '<tr><th>Спринт</th><th>Период</th><th>Взято</th><th>Выполнено</th><th>Перенесено вручную</th><th>Ушло автоматически</th></tr>'+
   hist.map(s=>'<tr><td><b>Спринт '+s.n+'</b></td><td>'+fmt(s.start)+" — "+fmt(s.end)+'</td><td>'+s.summary.n+
    '</td><td><b style="color:var(--green)">'+s.summary.done+'</b> · '+s.summary.pct+'%</td><td>'+s.summary.moved+
    '</td><td>'+s.summary.none+'</td></tr>').join("")+'</table>';v.append(h);}
 const sp=active(),cur=T.filter(t=>sprintOf(t)===sp.n),c=counts(cur);
 const s1=document.createElement("div");
 s1.innerHTML='<div class="sect">Текущий спринт '+sp.n+' · '+fmt(sp.start)+" — "+fmt(sp.end)+'</div><table class="an">'+
  '<tr><th>Показатель</th><th>Значение</th></tr>'+
  '<tr><td>Взято в спринт</td><td><b>'+c.n+'</b></td></tr>'+
  '<tr><td>Выполнено</td><td><b style="color:var(--green)">'+c.done+'</b> · '+c.pct+'%</td></tr>'+
  '<tr><td>Помечено к переносу</td><td><b style="color:var(--amber)">'+c.moved+'</b></td></tr>'+
  '<tr><td>Без отметки</td><td>'+(c.n-c.done-c.moved)+'</td></tr>'+
  '<tr><td>Пришло из прошлого спринта</td><td>'+cur.filter(t=>st.carried[t.id]).length+'</td></tr>'+
  '<tr><td>На сверке: по плану / риск / проблема</td><td>'+
   cur.filter(t=>(st.check[t.id]||{}).s==="ok").length+" / "+
   cur.filter(t=>(st.check[t.id]||{}).s==="risk").length+" / "+
   cur.filter(t=>(st.check[t.id]||{}).s==="prob").length+'</td></tr></table>';
 v.append(s1);
 const probs=cur.filter(t=>{const c=st.check[t.id]||{};return c.s==="risk"||c.s==="prob";});
 if(probs.length){const p=document.createElement("div");
  p.innerHTML='<div class="sect">Риски и проблемы со сверки</div><table class="an">'+
   '<tr><th>Задача</th><th>Ответственный</th><th>Статус</th><th>Комментарий</th></tr>'+
   probs.map(function(t){const c=st.check[t.id]||{};
    return '<tr><td>'+t.t+'</td><td>'+t.own+'</td><td>'+
     (c.s==="prob"?'<span class="tag prob">проблема</span>':'<span class="tag risk">риск</span>')+
     '</td><td>'+(c.note||'<span style="color:var(--faint)">не описано</span>')+'</td></tr>';}).join("")+'</table>';
  v.append(p);}
 const moved=cur.filter(t=>stat(t)==="moved");
 if(moved.length){const m=document.createElement("div");
  m.innerHTML='<div class="sect">Переносы и причины</div><table class="an">'+
   '<tr><th>Задача</th><th>Инициатива</th><th>Ответственный</th><th>Причина</th></tr>'+
   moved.map(t=>'<tr><td>'+t.t+'</td><td>'+t.ini+'</td><td>'+t.own+'</td><td>'+
    (st.reason[t.id]||'<span style="color:var(--faint)">не указана</span>')+'</td></tr>').join("")+'</table>';v.append(m);}
 const rows=[];DATA.forEach(d=>d.inis.forEach(i=>{const cc=counts(tasksOf(d,i));
  rows.push({name:i.name,own:i.own,end:i.end,n:cc.n,done:cc.done,pct:cc.pct,over:cc.over});}));
 rows.sort((a,b)=>b.over-a.over||a.pct-b.pct);
 const t1=document.createElement("div");
 t1.innerHTML='<div class="sect">По инициативам</div><table class="an">'+
  '<tr><th>Инициатива</th><th>Ответственный</th><th>Срок</th><th>Прогресс</th><th>Готово</th><th>Просрочено</th></tr>'+
  rows.map(r=>'<tr><td><b>'+r.name+'</b></td><td>'+r.own+'</td><td>'+fmt(r.end)+
   '</td><td><div class="bar"><i style="width:'+r.pct+'%"></i></div></td><td>'+r.done+"/"+r.n+' · '+r.pct+
   '%</td><td>'+(r.over?'<b style="color:var(--red)">'+r.over+'</b>':'—')+'</td></tr>').join("")+'</table>';v.append(t1);
 const byO={};T.forEach(t=>{(byO[t.own]=byO[t.own]||[]).push(t);});
 const orows=Object.entries(byO).map(function(x){const o=x[0],l=x[1],cc=counts(l);
  return{o:o,n:cc.n,done:cc.done,pct:cc.pct,over:cc.over,sp:l.filter(t=>sprintOf(t)===sp.n).length};})
  .sort((a,b)=>b.n-a.n);
 const t2=document.createElement("div");
 t2.innerHTML='<div class="sect">По людям</div><table class="an">'+
  '<tr><th>Ответственный</th><th>Всего</th><th>В текущем спринте</th><th>Выполнено</th><th>Просрочено</th></tr>'+
  orows.map(r=>'<tr><td><b>'+r.o+'</b></td><td>'+r.n+'</td><td>'+r.sp+'</td><td>'+r.done+' · '+r.pct+
   '%</td><td>'+(r.over?'<b style="color:var(--red)">'+r.over+'</b>':'—')+'</td></tr>').join("")+'</table>';v.append(t2);
 const risky=T.filter(overdue).sort((a,b)=>a.e.localeCompare(b.e));
 const t3=document.createElement("div");
 t3.innerHTML='<div class="sect">Где рискуем не успеть</div>'+(risky.length?
  '<table class="an"><tr><th>Задача</th><th>Инициатива</th><th>Ответственный</th><th>Срок был</th></tr>'+
  risky.map(t=>'<tr><td>'+t.t+'</td><td>'+t.ini+'</td><td>'+t.own+'</td><td style="color:var(--red)">'+
   fmt(t.e)+'</td></tr>').join("")+'</table>':'<div class="empty">Просроченных задач нет.</div>');v.append(t3);}

function logView(){
 const v=document.getElementById("view");v.innerHTML="";const log=st.log||[];
 if(!log.length){v.innerHTML='<div class="empty">Пока изменений нет.</div>';return;}
 const sel2=document.createElement("div");sel2.className="tools";
 sel2.innerHTML='<select id="lp"><option value="1">За сегодня</option><option value="3">За 3 дня</option>'+
  '<option value="7">За неделю</option><option value="999" selected>За всё время</option></select>';
 v.append(sel2);const wrap=document.createElement("div");v.append(wrap);
 function draw(days){wrap.innerHTML="";const lim=Date.now()-days*864e5;
  const rows=log.filter(x=>x.ts>=lim);
  if(!rows.length){wrap.innerHTML='<div class="empty">За этот период изменений нет.</div>';return;}
  let day=null;
  rows.forEach(x=>{const d=new Date(x.ts).toLocaleDateString("ru-RU",{day:"2-digit",month:"long"});
   if(d!==day){const hh=document.createElement("div");hh.className="logday";hh.textContent=d;wrap.append(hh);day=d;}
   const r=document.createElement("div");r.className="logrow";
   r.innerHTML='<span class="tm">'+new Date(x.ts).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})+
    '</span><span style="flex:1"><b>'+x.task+'</b> — '+x.act+
    (x.ini?' <span style="color:var(--faint)">· '+x.ini+'</span>':'')+
    (x.detail?'<div style="color:var(--soft);font-size:12px;margin-top:3px">'+x.detail+'</div>':'')+'</span>';
   wrap.append(r);});}
 draw(999);sel2.querySelector("#lp").onchange=e=>draw(+e.target.value);}

function tabs(){const el=document.getElementById("tabs");el.innerHTML="";
 st.sprints.forEach(s=>{const b=document.createElement("button");
  b.className="tab"+(s.closed?" closed":"");
  b.textContent="Спринт "+s.n+(s.closed?" · закрыт":(frozen(s)?" · заморожен":""));
  b.setAttribute("aria-pressed",String(view==="s"+s.n));
  b.onclick=()=>{view="s"+s.n;render();};el.append(b);});
 [["chk","Чекпоинт · спринт "+active().n],["all","Все инициативы"],["an","Аналитика"],["log","Журнал"]].forEach(function(x){
  const b=document.createElement("button");b.className="tab";b.textContent=x[1];
  b.setAttribute("aria-pressed",String(view===x[0]));
  b.onclick=()=>{view=x[0];render();};el.append(b);});}

function render(){
 buildAll();tabs();
 const sp=active(),cur=T.filter(t=>sprintOf(t)===sp.n),all=counts(T),c=counts(cur);
 document.getElementById("k1").textContent=T.length;
 document.getElementById("k2").textContent=c.n;
 document.getElementById("k3").textContent=c.done;
 document.getElementById("k4").textContent=c.moved;
 document.getElementById("k5").textContent=all.over;
 document.getElementById("sub").textContent="16 инициатив · спринт "+sp.n+": "+fmt(sp.start)+" — "+
  fmt(sp.end)+" · заморозка "+sp.freeze.replace("T"," ");
 const spv=(String(view)[0]==="s"&&view!=="an"&&view!=="all"&&view!=="log"&&view!=="chk");
 const spn=spv?st.sprints.find(x=>x.n===+String(view).slice(1)):null;
 const canEdit=(view==="all")||(spn&&!frozen(spn));
 document.getElementById("edit").style.display=canEdit?"":"none";
 if(!canEdit)editMode=false;
 if(view==="chk"){checkView();return;}
 if(view==="all"){allView();return;}
 if(view==="an"){anView();return;}
 if(view==="log"){logView();return;}
 const n=+String(view).slice(1);const s=st.sprints.find(x=>x.n===n);
 sprintView(s||active());}

const sel=document.getElementById("who");
document.getElementById("edit").onclick=()=>{editMode=!editMode;
 const b=document.getElementById("edit");b.textContent=editMode?"Выйти из редактирования":"Режим редактирования";
 b.className=editMode?"btn":"btn gh";render();};
document.getElementById("q").oninput=e=>{q=e.target.value.toLowerCase();render();};
document.getElementById("exp").onclick=()=>{
 const sp=active();const L=["# Качество в Европе — итоги","","Всего задач: "+T.length,""];
 st.sprints.filter(s=>s.closed).forEach(s=>{
  L.push("## Спринт "+s.n+" ("+fmt(s.start)+" — "+fmt(s.end)+") — закрыт");
  L.push("Взято "+s.summary.n+", выполнено "+s.summary.done+" ("+s.summary.pct+"%), перенесено вручную "+
   s.summary.moved+", ушло автоматически "+s.summary.none,"");
  (s.rows||[]).forEach(r=>L.push("- ["+(r.status==="done"?"x":" ")+"] "+r.t+" · "+r.own+
   (r.status==="moved"?"  ПЕРЕНЕСЕНА: "+(r.reason||"причина не указана"):"")));L.push("");});
 const cur=T.filter(t=>sprintOf(t)===sp.n),c=counts(cur);
 L.push("## Спринт "+sp.n+" ("+fmt(sp.start)+" — "+fmt(sp.end)+") — идёт");
 L.push("Взято "+c.n+", выполнено "+c.done+" ("+c.pct+"%), к переносу "+c.moved,"");
 cur.forEach(t=>L.push("- ["+(stat(t)==="done"?"x":" ")+"] "+t.t+" · "+t.own+" · до "+fmt(t.e)+
  (st.carried[t.id]==="auto"?"  (не выполнена в прошлом спринте)":st.carried[t.id]==="manual"?"  (перенесена из прошлого спринта)":"")+
  (stat(t)==="moved"?"  К ПЕРЕНОСУ: "+(st.reason[t.id]||"причина не указана"):"")+
  (function(){const c=st.check[t.id]||{};return c.s==="risk"?"  РИСК: "+(c.note||"без описания"):
   c.s==="prob"?"  ПРОБЛЕМА: "+(c.note||"без описания"):"";})()));
 L.push("");
 DATA.forEach(d=>d.inis.forEach(i=>{const cc=counts(tasksOf(d,i));
  L.push("### "+i.name+" — "+cc.done+"/"+cc.n+" ("+cc.pct+"%)");}));
 const b=new Blob([L.join("\n")],{type:"text/markdown;charset=utf-8"});
 const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="Итоги_спринтов.md";a.click();
 if(navigator.clipboard)navigator.clipboard.writeText(L.join("\n")).catch(()=>{});};
(async()=>{await load();buildAll();
 const os=[...new Set(T.map(t=>t.own))].sort();
 os.forEach(o=>{const op=document.createElement("option");op.value=o;op.textContent=o;sel.append(op);});
 sel.onchange=()=>{who=sel.value;render();};
 view="s"+active().n;render();})();
</script>
